function weaponStats(w){let name=normalizeWeaponName(w.name),alias={'javelines':'javeline','javelots':'javeline','javelot':'javeline','baton de combat':'baton','epee batarde':'epee longue','glaive':'coutille','fleau':'fleau d armes','fleau d armes':'fleau d armes'};name=alias[name]||name;let e=OFFICIAL_WEAPONS.find(x=>normalizeWeaponName(x[0])===name);if(!e)return null;let [label,die,kind,category,near,far,flags]=e;let str=mod(Number(data.stats.FOR)||10),dex=mod(Number(data.stats.DEX)||10),ability=kind==='DEX'?'DEX':kind==='FIN'&&dex>str?'DEX':'FOR',bonus=ability==='DEX'?dex:str;let prof=2+Math.floor((Math.max(1,Number(data.level)||1)-1)/4);let mastered=weaponMastery(e);let thrown=flags.includes('jet'),ranged=flags.includes('distance');let rage=isBarbarian()&&data.rageActive&&ability==='FOR'&&!ranged;let rageBonus=rage?rageDamage():0;let poly=(flags.match(/poly:(\d+D\d+)/)||[])[1]||null;return {die,ability,hit:bonus+(mastered?prof:0),damage:bonus+rageBonus,baseDamage:bonus,rageBonus,near,far,thrown,ranged,poly,reach:flags.includes('allonge')?3:1.5,mastered,label,flags}}
function weaponMastery(e){let cls=String(data.cls||'').toLowerCase(),race=String(data.race||'').toLowerCase(),name=normalizeWeaponName(e[0]),category=e[3];if(/barbare|guerrier|paladin|rodeur|rôdeur/.test(cls))return true;if(category==='simple'&&/barde|clerc|druide|moine|occultiste/.test(cls))return true;if(/roublard/.test(cls))return category==='simple'||['rapiere','epee courte','arbalete de poing','epee longue'].includes(name);if(/barde/.test(cls))return ['rapiere','epee courte','epee longue','arbalete de poing'].includes(name);if(/magicien|ensorceleur/.test(cls))return ['dague','flechette','fronde','baton','arbalete legere'].includes(name)&&( /magicien/.test(cls)||name==='dague'||name==='fronde'||name==='arbalete legere');if(/druide/.test(cls))return ['gourdin','dague','flechette','javeline','masse d armes','baton','cimeterre','serpe','fronde','lance'].includes(name);if(/moine/.test(cls))return name==='epee courte';if(/nain/.test(race)&&['hache d armes','hachette','marteau leger','marteau de guerre'].includes(name))return true;if(/elfe/.test(race)&&!(/demi/.test(race))&&['epee longue','epee courte','arc court','arc long'].includes(name))return true;return false}
function weaponCombatLine(w){let v=weaponStats(w);if(!v)return '<div class="muted" style="margin-top:6px">Arme personnalisée : caractéristiques à renseigner</div>';let block=(label,damage)=>'<div class="row" style="gap:12px;flex-wrap:wrap;margin-top:7px"><div><small class="muted">'+label+' · POUR TOUCHER</small><div><b>D20 '+fmt(v.hit)+'</b></div></div><div><small class="muted">DÉGÂTS</small><div><b>'+v.die+(v.die==='—'?'':' '+fmt(damage))+'</b></div></div></div>';let range='<div class="muted">🎯 '+v.near+' / '+v.far+' m · désavantage après '+v.near+' m · impossible au-delà de '+v.far+' m</div>';let rage=v.rageBonus?'<div style="color:#f87171;font-weight:700">🔥 Rage '+fmt(v.rageBonus)+'</div>':'';let prof=!v.mastered?'<div class="muted">Sans maîtrise : bonus de maîtrise non appliqué</div>':'';if(v.thrown&&!v.ranged)return block('⚔️ MÊLÉE',v.damage)+rage+'<div class="muted">📏 '+v.reach+' m</div>'+block('🎯 LANCER',v.baseDamage)+range+prof;if(v.ranged)return block('🎯 DISTANCE',v.baseDamage)+range+prof;return block('⚔️ MÊLÉE',v.damage)+rage+'<div class="muted">📏 '+v.reach+' m'+(v.poly?' · à deux mains : '+v.poly+' '+fmt(v.damage):'')+'</div>'+prof}
function barbarianPanel(){if(!isBarbarian())return '';let max=rageMax(),used=data.rageUsed||0,active=!!data.rageActive;return '<div class="card" style="border:1px solid #a44b42"><h2>🔥 Rage du Barbare</h2><p class="muted">Rages restantes : <b>'+(max===Infinity?'∞':Math.max(0,max-used)+' / '+max)+'</b></p><div class="row">'+button(active?'🔥 Rage active — terminer':'🔥 Activer la rage','toggleRage()','primary')+'</div>'+(active?'<div class="item"><b>🔥 Rage active</b><p>+ '+rageDamage()+' dégâts aux attaques de mêlée utilisant la Force</p><p>Avantage aux tests et sauvegardes de Force</p><p>Résistance aux dégâts contondants, perforants et tranchants</p><p>Pas de sorts ni de concentration pendant la rage</p></div>':'')+'<div class="item"><b>⚔️ Attaques par action :</b> '+(data.level>=5?2:1)+'</div>'+(data.level>=2?'<div class="item"><b>Attaque téméraire</b><p class="muted">Avantage à tes attaques de mêlée avec Force ce tour ; les ennemis ont avantage contre toi jusqu’au prochain tour.</p></div>':'')+'<p class="hint">La rage dure jusqu’à 1 minute, sous réserve des conditions de maintien. Le joueur termine la rage manuellement.</p></div>'}
function toggleRage(){if(!isBarbarian())return;if(data.rageActive){change(()=>{data.rageActive=false;log('Fin de rage')});return}if((data.rageUsed||0)>=rageMax())return alert('Plus de rage disponible avant un repos long.');change(()=>{data.rageUsed=(data.rageUsed||0)+1;data.rageActive=true;data.concentration='';data.haste=false;log('Entrée en rage')})}

function saveEquipment(id){let name=textval('eqName').trim(),raw=textval('eqAC'),value=textval('eqValue');if(!name||raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0)||value!==''&&(!Number.isFinite(Number(value))||Number(value)<0))return alert('Vérifie le nom, la CA et la valeur');change(()=>{if(!Array.isArray(data.equipment))data.equipment=[];let e=data.equipment.find(x=>x.id===id);if(!e){e={id:Date.now(),equipped:false,qty:1};data.equipment.push(e)}e.name=name;e.notes=textval('eqNotes');e.acTotal=raw===''?null:Number(raw);e.value=value});closeModal()}

function adjustConstitutionHP(previous){let delta=(mod(data.stats.CON)-Math.floor(((Number(previous)||10)-10)/2))*Math.max(1,Number(data.level)||1);if(delta){data.maxHp=Math.max(1,Number(data.maxHp)+delta);data.hp=Math.max(0,Math.min(data.maxHp,Number(data.hp)+delta))}return delta}

function isConsumableWeapon(w){let n=String(w.name||'').toLowerCase();return /flèche|fleche|carreau|munition|bille|balle|javel|dard|projectile|pierre de fronde|sarbacane|trait d.arbalète|trait d.arbalete|lance[- ]pierre/.test(n)||w.consumable===true}
function change(fn){fn();save();render()}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',2800)}function log(s){data.history.unshift(new Date().toLocaleString('fr-FR')+' — '+s);data.history=data.history.slice(0,40)}function count(item,collection,delta){change(()=>{item.qty=Math.max(0,(Number(item.qty)||0)+delta);if(item.qty===0&&Array.isArray(data[collection]))data[collection]=data[collection].filter(x=>x.id!==item.id)})}function hasSpellcastingAccess(){let cls=String(data.cls||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');let level=Math.max(1,Number(data.level)||1);if(/barbare/.test(cls))return false;if(/roublard/.test(cls))return level>=3&&/filou arcanique|arcane trickster/.test(String(data.subclass||''));if(/guerrier/.test(cls))return level>=3&&/chevalier occulte|eldritch knight/.test(String(data.subclass||''));if(/paladin|rodeur/.test(cls))return level>=2;if(/magicien|clerc|druide|barde|ensorceleur|occultiste/.test(cls))return true;return (Array.isArray(data.racialSpells)&&data.racialSpells.length>0)||(Array.isArray(data.grantedSpells)&&data.grantedSpells.length>0)}
function render(){if(fdcScreen!=='sheet'){document.getElementById('tabs').innerHTML='';document.getElementById('headName').textContent='FDC — Mon Personnage';document.getElementById('headMeta').textContent='';document.getElementById('headAvatar').hidden=true;app.innerHTML=fdcScreen==='home'?fdcHomeHtml():fdcScreen==='list'?fdcListHtml():fdcCreateHtml();return}if(tab==='sorts'&&!hasSpellcastingAccess())tab='fiche';let fullName=[data.name,data.lastName].map(x=>String(x||'').trim()).filter(Boolean).join(' ');document.getElementById('headName').textContent=fullName;document.getElementById('headName').hidden=!fullName;let meta=[data.race,data.cls,Number(data.level)>0?'Niveau '+data.level:''].map(x=>String(x||'').trim()).filter(Boolean).join(' · ');document.getElementById('headMeta').textContent=meta;document.getElementById('headMeta').hidden=!meta;let avatar=document.getElementById('headAvatar');avatar.hidden=!data.portrait;avatar.innerHTML=data.portrait?'<img src="'+data.portrait+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="Portrait">':'';document.getElementById('tabs').innerHTML=[['fiche','🛡️','Fiche'],['sac','🎒','Sac à dos'],...(hasSpellcastingAccess()?[['sorts','✨','Sorts']]:[]),['reglages','⚙️','Options']].map(([id,ic,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><span>${ic}</span>${n}</button>`).join('');app.innerHTML='<div class="row" style="margin:0 0 12px">'+button('⌂ Accueil','showFdcHome()','small secondary')+button('📚 Mes fiches','showFdcList()','small secondary')+'</div>'+({fiche:fiche,sac:sac,sorts:sorts,reglages:reglages})[tab]()}function button(label,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function fiche(){const stat=selected?data.stats[selected]:0,p=mod(stat),pr=proficiencyBonus();const ratio=Math.max(0,data.hp)/Math.max(1,data.maxHp);const hpColor=ratio<=.05?'#e0444e':ratio<=.5?'#efa34b':'#3abf78';return `<div class="card"><div class="row"><div><div class="muted">❤️ Points de vie</div><div class="big">${data.hp} <span class="muted">/ ${data.maxHp}</span></div></div><div style="text-align:right"><div class="muted">🛡️ Classe d’armure</div><div class="big">${effectiveAC()}</div>${activeACLabels()}</div></div><div class="bar"><div style="width:${Math.min(100,100*ratio)}%;background:${hpColor}"></div></div><div class="row">${button('− Dégâts',"openHP('damage')")}${button('+ Soins',"openHP('heal')")}${button('✎ PV / CA',"openHP('edit')")}</div></div><div class="card"><div class="row"><h2>Caractéristiques</h2>${button('✎ Modifier',"openStats()",'small secondary')}</div><div class="grid">${Object.keys(names).map(k=>`<div class="stat ${selected===k?'active':''}" onclick="selected=selected==='${k}'?null:'${k}';render()"><small>${k}</small><strong>${fmt(mod(data.stats[k]))}</strong><small>Score ${data.stats[k]}</small>${data.effectOn&&data.dis.includes(k)?'<div class="badge">Désavantage</div>':data.effectOn&&data.adv.includes(k)?'<div class="badge">Avantage</div>':''}</div>`).join('')}</div>${selected?`<div class="line"><h3>${names[selected]} — Sauvegarde ${fmt(saveModifier(selected))}</h3><div class="muted">${data.saveProf.includes(selected)?'Sauvegarde maîtrisée : +'+pr+' • ':'Sauvegarde non maîtrisée • '}Bonus de maîtrise du personnage : +${pr}</div>${skills[selected].length?skills[selected].map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #383c46"><span>${s}${data.proficiencies.includes(s)?' ★':''}${(data.expertise||[]).includes(s)?' ×2':''}</span><strong>${fmt(skillModifier(selected,s))}</strong></div>`).join(''):'<p class="muted">Aucune compétence associée.</p>'}${data.effectOn&&data.dis.includes(selected)?'<p class="pill">Désavantage aux jets concernés</p>':''}</div>`:''}</div><div class="card"><div class="row"><h2>⚔️ Armes & munitions</h2>${button('+ Ajouter',"openAdd('weapons')",'small secondary')}</div>${data.weapons.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)} ${w.equipped?'✓':''}</div><div class="muted">${esc(w.notes||'')}</div>${weaponCombatLine(w)}</div>${button('✎',`openEdit('weapons',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:8px"><span class="muted">${isConsumableWeapon(w)?'Quantité':''}</span><div class="count">${isConsumableWeapon(w)?button('−',`updateQty('weapons',${w.id},-1)`,'small secondary')+'<b>'+w.qty+'</b>'+button('+',`updateQty('weapons',${w.id},1)`,'small secondary'):'<span class="muted">Arme équipée / conservée</span>'}</div></div></div>`).join('')}</div>${barbarianPanel()}${roguePanel()}${classRacePanel()}${progressionPanel()}${abilityPanel()}${equipmentPanel()}<div class="card"><div class="row"><h2>✨ Sorts</h2>${button('Voir tous les sorts',"tab='sorts';render()",'small secondary')}</div><p class="muted">Emplacements disponibles (démo) :</p><div class="slotmini">${Object.entries(data.slots).map(([lv,x])=>`<div class="slotchip">Niv. ${lv} : <b>${x.max-x.used}/${x.max}</b> ${button('−',`slot(${lv},1)`,'small secondary')}${button('+',`slot(${lv},-1)`,'small secondary')}</div>`).join('')}</div><p class="muted">Les sorts attribués à la classe seront ajoutés après validation de la base de règles.</p></div>`}function sac(){return `<div class="card"><div class="row"><div><h2>🎒 Sac à dos</h2><div class="muted">Objets, potions et trésors</div></div>${button('+ Ajouter',"openAdd('bag')")}</div></div><div class="card"><div class="row"><div><h2>💰 Bourse</h2><div class="coinrow">${[['pp','PP'],['po','PO'],['pe','PE'],['pa','PA'],['pc','PC']].map(([k,label])=>`<div class="coin"><b>${data.coins[k]||0}</b><small>${label}</small></div>`).join('')}</div></div>${button('✎ Modifier',"openGold()")}</div></div><div class="card"><h2>Inventaire</h2>${data.bag.length?data.bag.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)}</div><div class="muted">${esc(w.notes||'')} ${w.value!==''?'• Valeur estimée : '+esc(w.value)+' PO':''}</div></div>${button('✎',`openEdit('bag',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:10px"><div class="count">${button('−',`updateQty('bag',${w.id},-1)`,'small secondary')}<b>${w.qty}</b>${button('+',`updateQty('bag',${w.id},1)`,'small secondary')}</div><div style="display:flex;gap:6px">${['heal','consumable','food'].includes(w.type)?button('Utiliser',`openUse(${w.id})`,'small'):''}${button('Vendre',`openSale(${w.id})`,'small secondary')}</div></div></div>`).join(''):'<p class="muted">Ton sac est vide.</p>'}</div><div class="card"><h2>📝 Notes de butin</h2><textarea id="notes" rows="4" placeholder="Indices, origine des objets, descriptions…" oninput="data.notes=this.value;save()">${esc(data.notes)}</textarea></div>`}function sorts(){return `<div class="card"><h2>✨ Sorts et emplacements</h2><p class="hint">Cette version permet de tester le suivi des emplacements. Les listes officielles par classe, espèce, sous-classe et édition ne sont pas encore intégrées : aucun sort ne sera attribué automatiquement dans ce prototype.</p></div><div class="card">${Object.entries(data.slots).map(([lv,s])=>`<div class="item"><div class="row"><div><strong>Emplacements niveau ${lv}</strong><div class="muted">${s.max-s.used} / ${s.max} disponibles</div></div><div class="count">${button('−',`slot(${lv},1)`,'small secondary')}<b>${s.max-s.used}</b>${button('+',`slot(${lv},-1)`,'small secondary')}</div></div></div>`).join('')}${button('Repos long : récupérer les emplacements',"longRest()")}</div><div class="card"><h2>À intégrer dans la prochaine version</h2><p class="muted">Grimoire, sorts connus/préparés, capacités raciales, concentration et descriptions filtrées selon les règles 2014/2024.</p></div>`}function niveau(){return `<div class="card"><h2>⬆️ Progression</h2><div class="big">Niveau ${data.level} <span class="red">→ ${Math.min(20,data.level+1)}</span></div><p class="hint">Version test : montée de niveau simplifiée. Le moteur complet de progression par classe, espèce et édition n'est pas encore connecté. Les gains de capacités et de sorts doivent être vérifiés dans les règles.</p>${data.level<20?button('Tester la montée de niveau',"openLevel()"):''}</div><div class="card"><h2>Historique</h2>${data.history.length?data.history.map(x=>`<div class="line muted">${esc(x)}</div>`).join(''):'<p class="muted">Aucune modification enregistrée.</p>'}</div>`}function reglages(){return `<div class="card"><h2>⚙️ Personnage</h2>${button('Modifier identité et édition',"openCharacter()")}</div><div class="card"><h2>🛡️ Gérer équipement et outils</h2><p class="muted">Ajoute ou modifie les équipements et capacités. Les sections vides restent masquées sur la fiche.</p>${button('Gérer équipement',"openEquipmentManager()",'secondary')} ${button('Ajouter un outil ou une capacité',"openAbilityEdit()",'secondary')}</div><div class="card"><h2>💾 Sauvegarde</h2><p class="muted">Les modifications sont conservées localement dans ce navigateur sur cet appareil. Elles ne se synchronisent pas entre appareils. Pour éviter toute perte, exporte une copie.</p><div class="row">${button('Exporter JSON',"exportData()")}${button('Importer JSON',"document.getElementById('importfile').click()",'secondary')}</div><input type="file" id="importfile" accept="application/json" class="hidden" onchange="importData(this)"></div><div class="card"><h2>Réinitialiser la démo</h2>${button('Remettre les données fictives',"resetDemo()",'secondary')}</div>`}function show(html){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="secondary" onclick="closeModal()">✕ Fermer</button></div>${html}</div>`}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}function num(id){return Number(document.getElementById(id).value)}function textval(id){return document.getElementById(id).value}function openHP(mode){if(mode==='edit'){show(`<h2>Modifier PV et CA</h2><label>PV actuels</label><input id="a" type="number" value="${data.hp}"><label>PV maximum</label><input id="b" type="number" value="${data.maxHp}"><label>Classe d'armure</label><input id="c" type="number" value="${data.ac}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer',`saveHP()`)}</div>`);return}show(`<h2>${mode==='heal'?'❤️ Soigner':'⚔️ Subir des dégâts'}</h2><p class="muted">Saisis le résultat de tes dés physiques ou les dégâts annoncés par le MJ.</p><label>${mode==='heal'?'PV récupérés':'Dégâts subis'}</label><input id="amount" type="number" min="0" value="5"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`applyHP('${mode}')`)}</div>`)}function saveHP(){let a=num('a'),b=num('b'),c=num('c');if(![a,b,c].every(Number.isFinite)||b<1||a<0||c<0)return alert('Valeurs invalides');change(()=>{data.maxHp=b;data.hp=Math.min(a,b);data.ac=c;log('PV / CA modifiés')});closeModal()}function applyHP(mode){let v=num('amount');if(!Number.isFinite(v)||v<0)return alert('Valeur invalide');change(()=>{data.hp=mode==='heal'?Math.min(data.maxHp,data.hp+v):Math.max(0,data.hp-v);log((mode==='heal'?'Soins':'Dégâts')+' : '+v)});closeModal()}function openStats(){show(`<h2>Modifier les caractéristiques</h2>${Object.keys(names).map(k=>`<div class="row"><label style="min-width:95px">${names[k]}</label><input id="st${k}" type="number" min="1" max="30" value="${data.stats[k]}"></div>`).join('')}<div class="line"><label>Nom de l'effet personnalisé</label><input id="effect" value="${esc(data.effect)}"><div class="check"><input type="checkbox" id="effectOn" ${data.effectOn?'checked':''}><label for="effectOn">Effet actif</label></div><p class="muted">Choisis les caractéristiques avec désavantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="dis${k}" ${data.dis.includes(k)?'checked':''}>${names[k]}</label>`).join('')}<p class="muted">Choisis les caractéristiques avec avantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="adv${k}" ${data.adv.includes(k)?'checked':''}>${names[k]}</label>`).join('')}</div><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveStats()')}</div>`)}function saveStats(){let vals=Object.fromEntries(Object.keys(names).map(k=>[k,num('st'+k)]));if(Object.values(vals).some(x=>!Number.isInteger(x)||x<1||x>30))return alert('Scores attendus de 1 à 30');change(()=>{let oldCon=data.stats.CON;data.stats=vals;adjustConstitutionHP(oldCon);data.effect=textval('effect');data.effectOn=document.getElementById('effectOn').checked;data.dis=Object.keys(names).filter(k=>document.getElementById('dis'+k).checked);data.adv=Object.keys(names).filter(k=>document.getElementById('adv'+k).checked);log('Caractéristiques / effets modifiés')});closeModal()}function updateQty(collection,id,delta){change(()=>{let x=data[collection].find(x=>x.id===id);if(!x)return;x.qty=Math.max(0,(Number(x.qty)||0)+delta);if(x.qty===0)data[collection]=data[collection].filter(item=>item.id!==id)})}function openAdd(collection){show(`<h2>${collection==='weapons'?'Ajouter une arme ou munition':'Ajouter au sac'}</h2><label>Nom</label><input id="n" placeholder="Ex. 12 flèches, potion, diamant…"><label>Quantité</label><input id="q" type="number" value="1" min="1">${collection==='bag'?'<label>Type</label><select id="type"><option value="other">Objet / trésor</option><option value="heal">Potion de soins</option><option value="consumable">Potion / consommable</option><option value="food">Nourriture / consommable</option></select><label>Valeur estimée en PO (facultatif)</label><input id="v" type="number" min="0" placeholder="Inconnue">':''}<label>Notes / effet</label><input id="note" placeholder="Description libre"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Ajouter',`addItem('${collection}')`)}</div><p class="muted">La dictée vocale peut utiliser le micro du clavier de ton téléphone.</p>`)}function addItem(collection){let n=textval('n').trim(),q=num('q');if(!n||!Number.isInteger(q)||q<1)return alert('Indique un nom et une quantité valide');let v=collection==='bag'?textval('v'):'';if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))return alert('Valeur invalide');change(()=>{data[collection].push({id:Date.now(),name:n,qty:q,notes:textval('note'),...(collection==='bag'?{type:textval('type'),value:v}:{equipped:false})});log('Ajout : '+n)});closeModal();toast('Objet ajouté')}function openEdit(collection,id){let w=data[collection].find(x=>x.id===id);if(!w)return;show(`<h2>Modifier l'objet</h2><label>Nom</label><input id="n" value="${esc(w.name)}"><label>Notes</label><input id="note" value="${esc(w.notes||'')}">${collection==='bag'?`<label>Valeur estimée en PO</label><input id="v" type="number" value="${esc(w.value??'')}"><label>Type</label><select id="type"><option value="other" ${w.type==='other'||w.type==='treasure'?'selected':''}>Objet / trésor</option><option value="heal" ${w.type==='heal'?'selected':''}>Potion de soins</option><option value="consumable" ${w.type==='consumable'?'selected':''}>Potion / consommable</option><option value="food" ${w.type==='food'?'selected':''}>Nourriture / consommable</option></select>`:`<label class="check"><input id="eq" type="checkbox" ${w.equipped?'checked':''}>Arme équipée</label>`}<div class="row">${button('Supprimer',`deleteItem('${collection}',${id})`,'secondary')}${button('Enregistrer',`saveItem('${collection}',${id})`)}</div>${button('Annuler','closeModal()','ghost')}`)}function saveItem(c,id){let n=textval('n').trim();if(!n)return alert('Nom requis');change(()=>{let w=data[c].find(x=>x.id===id);w.name=n;w.notes=textval('note');if(c==='bag'){w.value=textval('v');w.type=textval('type')}else w.equipped=document.getElementById('eq').checked});closeModal()}function deleteItem(c,id){if(!confirm('Supprimer cet objet ?'))return;change(()=>{data[c]=data[c].filter(x=>x.id!==id)});closeModal()}function openUse(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return toast('Objet épuisé');show(`<h2>🧪 Utiliser : ${esc(w.name)}</h2><p class="muted">Effet noté : ${esc(w.notes||'Non renseigné')}</p><p class="muted">Lance tes dés physiques si nécessaire. Si l'objet rend des PV, indique le total. Sinon, laisse 0.</p><label>PV récupérés</label><input id="heal" type="number" min="0" value="0"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`useHeal(${id})`)}</div>`)}function useHeal(id){let n=num('heal'),w=data.bag.find(x=>x.id===id);if(!w||w.qty<1||!Number.isFinite(n)||n<0)return alert('Valeur invalide');let actual=Math.min(n,Math.max(0,data.maxHp-data.hp));change(()=>{data.hp+=actual;w.qty--;if(w.qty===0)data.bag=data.bag.filter(item=>item.id!==id);log(w.name+' utilisée : '+actual+' PV récupérés')});closeModal();toast(actual?('+'+actual+' PV • objet décompté'):'Objet utilisé et décompté')}function openSale(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return;show(`<h2>💰 Vendre : ${esc(w.name)}</h2><p class="muted">Valeur estimée : ${esc(w.value||'inconnue')} PO par unité. Saisis le prix réellement obtenu auprès du marchand.</p><label>Quantité vendue (max ${w.qty})</label><input id="q" type="number" min="1" max="${w.qty}" value="1"><label>Prix total obtenu (PO)</label><input id="sale" type="number" min="0" value="${Number(w.value)||0}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Vendre',`sell(${id})`)}</div>`)}function sell(id){let q=num('q'),price=num('sale'),w=data.bag.find(x=>x.id===id);if(!w||!Number.isInteger(q)||q<1||q>w.qty||!Number.isFinite(price)||price<0)return alert('Quantité ou prix invalide');change(()=>{w.qty-=q;if(w.qty===0)data.bag=data.bag.filter(item=>item.id!==id);data.coins.po+=price;data.gold=data.coins.po;log('Vente '+q+' × '+w.name+' : +'+price+' PO')});closeModal();toast('+'+price+' PO dans la bourse')}function openGold(){show(`<h2>💰 Modifier la bourse</h2><p class="muted">PP : platine · PO : or · PE : électrum · PA : argent · PC : cuivre.</p>${[['pp','Platine'],['po','Or'],['pe','Électrum'],['pa','Argent'],['pc','Cuivre']].map(([k,n])=>`<label>Pièces de ${n}</label><input id="coin_${k}" type="number" min="0" step="1" value="${data.coins[k]||0}">`).join('')}<div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveGold()')}</div>`)}function saveGold(){let next={};for(let k of ['pp','po','pe','pa','pc']){let n=num('coin_'+k);if(!Number.isSafeInteger(n)||n<0)return alert('Montant invalide');next[k]=n}change(()=>{data.coins=next;data.gold=next.po;log('Bourse modifiée')});closeModal()}function slot(l,delta){change(()=>{let s=data.slots[l];s.used=Math.max(0,Math.min(s.max,s.used+delta))})}function longRest(){if(!confirm('Effectuer un repos long ?'))return;change(()=>{Object.values(data.slots).forEach(s=>s.used=0);data.hp=data.maxHp;data.rageUsed=0;data.rageActive=false;log('Repos long')});toast('Repos long terminé')}let cropState=null;
function setPortrait(input){let file=input.files?.[0];if(!file)return;input.value='';if(file.size>12000000)return alert('Image trop volumineuse (12 Mo maximum)');let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>startCrop(img);img.onerror=()=>alert('Image illisible');img.src=r.result};r.readAsDataURL(file)}
function startCrop(img){show('<h2>Recadrer le portrait</h2><div style="display:flex;flex-direction:column;align-items:center;gap:12px"><canvas id="cropCanvas" width="400" height="400" style="width:min(76vw,300px);height:min(76vw,300px);border-radius:50%;border:3px solid #b85d69;touch-action:none;cursor:grab;background:#252833"></canvas><p class="muted">Glisser pour déplacer · Pincer pour zoomer · Molette sur PC</p><div class="row">'+button('Annuler','closeModal()','secondary')+button('Valider','saveCrop()')+'</div></div>');let canvas=document.getElementById('cropCanvas'),ctx=canvas.getContext('2d'),base=Math.max(400/img.width,400/img.height),state={img,canvas,ctx,base,z:1,x:0,y:0,pts:new Map(),start:null};cropState=state;

function classLevelRule(){return LEVEL_CLASS_DATA.find(x=>x.re.test(String(data.cls||'')))||null}

const WIZARD_SLOTS=[[0,0,0,0,0,0,0,0,0],[2,0,0,0,0,0,0,0,0],[3,0,0,0,0,0,0,0,0],[4,2,0,0,0,0,0,0,0],[4,3,0,0,0,0,0,0,0],[4,3,2,0,0,0,0,0,0],[4,3,3,0,0,0,0,0,0],[4,3,3,1,0,0,0,0,0],[4,3,3,2,0,0,0,0,0],[4,3,3,3,1,0,0,0,0],[4,3,3,3,2,0,0,0,0],[4,3,3,3,2,1,0,0,0],[4,3,3,3,2,1,0,0,0],[4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,1,0],[4,3,3,3,2,1,1,1,0],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
function isWizard(){return /magicien/i.test(data.cls)}
function wizardInit(){if(!data.spellbook){data.spellbook=['Armure du mage','Bouclier','Missile magique','Mains brûlantes','Sommeil','Détection de la magie','Pas brumeux','Image miroir'];data.preparedSpells=['Armure du mage','Bouclier','Missile magique','Mains brûlantes','Pas brumeux','Image miroir'];data.cantrips=['Trait de feu','Prestidigitation','Main du mage'];save()}if(!Array.isArray(data.preparedSpells))data.preparedSpells=[];if(!Array.isArray(data.cantrips))data.cantrips=[];if(!data.slots)data.slots={};const table=WIZARD_SLOTS[Math.max(1,Math.min(20,data.level))];table.forEach((n,i)=>{const k=String(i+1);if(n>0){if(!data.slots[k])data.slots[k]={used:0,max:n};else {data.slots[k].max=n;data.slots[k].used=Math.min(n,data.slots[k].used||0)}}});}
function wizardMaxSpell(){return Math.min(9,Math.ceil(Math.max(1,Math.min(20,data.level))/2))}
function wizardBookMax(){return 6+2*Math.max(0,data.level-1)}
function wizardPreparedMax(){return Math.max(1,data.level+mod(data.stats.INT))}
function wizardCantripMax(){return data.level>=10?5:data.level>=4?4:3}
function spellLevel(name){return Number(Object.keys(WIZARD_SPELLS).find(k=>WIZARD_SPELLS[k].includes(name))||0)}
function spellAction(name,kind){wizardInit();if(kind!=='cantrip'&&spellLevel(name)>wizardMaxSpell())return toast('Niveau de sort non accessible');let list=kind==='cantrip'?'cantrips':'spellbook';change(()=>{if(data[list].includes(name)){data[list]=data[list].filter(x=>x!==name);if(kind!=='cantrip')data.preparedSpells=data.preparedSpells.filter(x=>x!==name)}else{if(kind==='cantrip'&&data.cantrips.length>=wizardCantripMax())return toast('Nombre maximal de tours de magie atteint');if(kind!=='cantrip'&&data.spellbook.length>=wizardBookMax())return toast('Maximum de sorts appris pour ce niveau');data[list].push(name)}})}
function spellPrepare(name){wizardInit();if(spellLevel(name)>wizardMaxSpell())return toast('Niveau de sort non accessible');if(!data.spellbook.includes(name))return;if(!data.preparedSpells.includes(name)&&data.preparedSpells.length>=wizardPreparedMax())return toast('Maximum de sorts préparés atteint');change(()=>{data.preparedSpells=data.preparedSpells.includes(name)?data.preparedSpells.filter(x=>x!==name):[...data.preparedSpells,name]})}
function spellInfo(name){let d=SPELL_DETAILS[name],lv=spellLevel(name);show(`<h2>✨ ${esc(name)}</h2><p class="muted">${lv===0?'Tour de magie':'Sort de niveau '+lv} • D&D 5e 2014</p>${d?`<p><b>${esc(d[0])}</b> • ${esc(d[1])} • Portée : ${esc(d[2])} • Durée : ${esc(d[3])}</p><div class="item">${esc(d[4])}</div>`:'<p class="muted">Ce sort est présent dans le catalogue. Son descriptif détaillé n’est pas encore renseigné dans cette version ; consulte les règles 2014 pour ses effets exacts.</p>'}<div class="row">${button('Fermer','closeModal()','secondary')}${isWizard()&&(data.cantrips.includes(name)||data.preparedSpells.includes(name))?button('✨ Lancer',`castSpell(${JSON.stringify(name).replace(/"/g,"&quot;")})`):''}</div>`)}
function effectiveAC(){let worn=(data.equipment||[]).find(x=>x.equipped&&x.acTotal!=null);let base=worn?Number(worn.acTotal):(data.unarmoredAC!=null?Number(data.unarmoredAC):(Number(data.ac)||10));if(data.mageArmor)base=Math.max(base,13+mod(data.stats.DEX));return base+(data.tempAcBonus||0)+(data.haste?2:0)}
function activeACLabels(){let tags=[];if(data.mageArmor)tags.push(['Armure du mage',Math.max(0,effectiveAC()-(data.tempAcBonus||0)-(data.haste?2:0)-(Number(data.ac)||10)),'mageArmor']);if(data.tempAcBonus)tags.push(['Bouclier',data.tempAcBonus,'tempAcBonus']);if(data.haste)tags.push(['Hâte',2,'haste']);return tags.map(([name,bonus,key])=>'<div style="font-size:12px;margin-top:5px;color:#c5e5d2">'+esc(name)+' '+(bonus?'+'+bonus+' CA':'actif')+' '+button('✕','removeACEffect(\''+key+'\')','small secondary')+'</div>').join('')}
function removeACEffect(key){if(!['mageArmor','tempAcBonus','haste'].includes(key))return;change(()=>{if(key==='tempAcBonus')data.tempAcBonus=0;else data[key]=false;if(key==='haste'&&data.concentration==='Hâte')data.concentration='';log('Effet terminé : '+key)})}
function castSpell(name){wizardInit();let lv=spellLevel(name);if(lv>0&&!data.preparedSpells.includes(name))return alert('Ce sort doit être préparé.');if(lv===0&&!data.cantrips.includes(name))return alert('Tour de magie non connu.');let slotLevel=lv;if(lv>0){let slot=data.slots[String(lv)];if(!slot||slot.used>=slot.max)return alert('Plus aucun emplacement de niveau '+lv+' disponible pour lancer '+name+'.');}let detail=SPELL_DETAILS[name];change(()=>{if(lv>0)data.slots[slotLevel].used++;if(detail&&['concentration','haste'].includes(detail[5]))data.concentration=name;if(detail&&detail[5]==='ac')data.tempAcBonus=5;if(detail&&detail[5]==='armor')data.mageArmor=true;if(detail&&detail[5]==='haste')data.haste=true;log('Sort lancé : '+name+(lv?' (emplacement '+slotLevel+')':''))});closeModal();let out='Sort lancé : '+name; if(detail&&detail[5]==='ac'){out+=' • Bonus temporaire de +5 CA jusqu’au début de ton prochain tour. Utilise « Fin du bonus » pour le retirer.'}if(detail&&detail[5]==='armor'){out+=' • Armure du mage activée (CA 13 + DEX sans armure).'}if(detail&&detail[5]==='haste'){out+=' • Hâte activée : +2 CA (concentration).'}if(detail&&detail[7])out+=' • Dés : '+detail[7];toast(out)}
function endMagicBuffs(){change(()=>{data.tempAcBonus=0;data.mageArmor=false;data.haste=false;data.concentration='';log('Effets magiques temporaires terminés')})}
function wizardDescription(name){const d=SPELL_DETAILS[name];if(!d)return '<div class="muted" style="margin-top:7px">Description détaillée à compléter et vérifier selon les règles D&D 5e 2014.</div>';return '<div class="muted" style="margin-top:7px;line-height:1.55"><b>'+esc(d[0])+'</b> · Incantation : '+esc(d[1])+' · Portée : '+esc(d[2])+' · Durée : '+esc(d[3])+'<div style="margin-top:5px;color:#e5e6ed">'+esc(d[4])+'</div></div>'}
function wizardEntry(n,l){let locked=l>wizardMaxSpell();let owned=l===0?data.cantrips.includes(n):data.spellbook.includes(n),prep=l===0?owned:data.preparedSpells.includes(n);let arg=JSON.stringify(n).replace(/"/g,'&quot;');return '<div class="item"><div class="row"><div style="flex:1;min-width:0"><b>'+esc(n)+'</b><div class="muted">'+(l?'Niveau '+l:'Tour de magie')+(prep?' • ✓ Prêt':owned?' • Grimoire':'')+'</div></div>'+button(owned?'−':'＋','spellAction('+arg+',\''+(l?'spell':'cantrip')+'\')','small secondary')+(l&&owned?button(prep?'✓':'Préparer','spellPrepare('+arg+')','small secondary'):'')+'</div>'+(locked?'<div class="muted">🔒 Accessible au niveau de personnage '+(l*2-1)+'</div>':'')+wizardDescription(n)+'</div>'}
function wizardRows(){let f=window.wizardFilter??-1,q=(window.wizardSearch||'').toLocaleLowerCase('fr');return Object.entries(WIZARD_SPELLS).filter(([lv])=>f===-1||Number(lv)===f).map(([lv,ns])=>{let names=ns.filter(n=>n.toLocaleLowerCase('fr').includes(q));return names.length?'<h3 style="margin:18px 0 8px">'+(Number(lv)?'Sorts de niveau '+lv:'Tours de magie')+'</h3>'+names.map(n=>wizardEntry(n,Number(lv))).join(''):''}).join('')||'<p class="muted">Aucun sort trouvé.</p>'}
function wizardShort(n){let d=SPELL_DETAILS[n];return d?esc(d[4]):'Effet détaillé à compléter selon les règles D&D 5e 2014.'}
function wizardPanel(){if(!isWizard())return '';wizardInit();let can=data.cantrips||[],pre=data.preparedSpells||[],known=data.spellbook||[],max=wizardMaxSpell();let levels=Array.from({length:max+1},(_,i)=>i);let owned=(l)=>l===0?can:known;let group=levels.map(l=>{let ns=(WIZARD_SPELLS[l]||[]).filter(n=>owned(l).includes(n));return ns.length?'<h3 style="margin:16px 0 7px">Niveau '+l+'</h3>'+ns.map(n=>{let prepared=l===0||pre.includes(n);let arg=JSON.stringify(n).replace(/"/g,'&quot;');return '<div class="item" style="background:#2b2e39;border-radius:13px;padding:14px;margin:7px 0"><div class="row"><strong style="flex:1">'+esc(n)+'</strong>'+ (l?button(prepared?'✓ Préparé':'Préparer','spellPrepare('+arg+')','small '+(prepared?'primary':'secondary'))+(prepared?button('Utiliser','castSpell('+arg+')','small primary'):''):button('Utiliser','castSpell('+arg+')','small primary'))+'</div><p class="muted" style="margin:14px 0 3px;line-height:1.5">'+wizardShort(n)+'</p></div>'}).join(''):''}).join('');let catalogue=levels.map(l=>'<details style="margin:7px 0"><summary style="cursor:pointer;padding:5px 0">Niveau '+l+'</summary><div style="padding:7px 0">'+(WIZARD_SPELLS[l]||[]).map(n=>{let arg=JSON.stringify(n).replace(/"/g,'&quot;'),has=owned(l).includes(n);return '<div class="item" style="margin:7px 0;padding:12px;border-radius:10px"><div class="row"><b style="flex:1">'+esc(n)+'</b>'+button(has?'✓ Appris':'Apprendre','spellAction('+arg+',\''+(l?'spell':'cantrip')+'\')','small '+(has?'secondary':'primary'))+'</div><p class="muted" style="margin:9px 0 0">'+wizardShort(n)+'</p></div>'}).join('')+'</div></details>').join('');return '<div class="card"><h2>📖 Grimoire du magicien</h2><p class="muted">Tours de magie : '+can.length+'/'+wizardCantripMax()+' • Sorts préparés : '+pre.length+'/'+wizardPreparedMax()+' • Niveaux accessibles : 0 à '+max+'</p><p class="muted">Sorts appris : '+known.length+'/'+wizardBookMax()+' (6 au niveau 1, puis 2 par niveau). Choisis tes sorts dans le catalogue, puis prépare-les.</p>'+ (group||'<p class="muted">Aucun sort inscrit dans le grimoire.</p>')+'</div><div class="card"><h3>🔎 Catalogue</h3>'+catalogue+'</div>'}
const oldSorts=sorts;
sorts=function(){if(!hasSpellcastingAccess())return '<div class="card"><p>Ce personnage n’a pas accès aux sorts à ce niveau.</p></div>';if(isWizard())wizardInit();let slotHtml=Object.entries(data.slots||{}).map(([lv,slot])=>`<div class="item"><div class="row"><span>Emplacements niv. ${lv}</span><strong>${Math.max(0,slot.max-slot.used)} / ${slot.max}</strong><span class="muted">${slot.used} utilisé${slot.used>1?'s':''}</span></div></div>`).join('');return `<div class="card"><h2>✨ Sorts & emplacements</h2>${slotHtml||'<p class="muted">Aucun emplacement pour cette classe.</p>'}</div>${isWizard()?wizardPanel():'<div class="card"><p class="muted">Les listes de sorts de cette classe ne sont pas encore automatisées. Aucun sort de magicien n’est attribué à une autre classe.</p></div>'}${data.concentration?`<div class="card">Concentration : ${esc(data.concentration)} ${button('Terminer','endMagicBuffs()','small secondary')}</div>`:''}`};
const originalFiche=fiche;
fiche=function(){if(isWizard())wizardInit();let html=originalFiche();if(isWizard()){let panel=`<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:wrap"><h2 style="margin:0">✨ Sorts</h2><div class="muted" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${Object.entries(data.slots||{}).filter(([lv,x])=>x.max>0).map(([lv,x])=>`<span class="slotchip">Niv. ${lv} : <b>${Math.max(0,x.max-x.used)}/${x.max}</b></span>`).join('')}</div></div>${[...(data.cantrips||[]),...(data.preparedSpells||[])].map(n=>{let lv=spellLevel(n),slot=data.slots&&data.slots[String(lv)],available=lv===0||!!(slot&&slot.max>slot.used),arg=JSON.stringify(n).replace(/"/g,'&quot;');return `<div class="row" style="padding:9px 7px;gap:7px;flex-wrap:wrap;border-bottom:1px solid #ffffff16;${available?'':'opacity:.48;background:#24242b;border-radius:8px;'}"><span style="flex:1;min-width:125px"><strong>${esc(n)}</strong><span class="muted" style="display:block;font-size:12px">${lv===0?'Tour de magie':'Niveau '+lv}</span></span>${button('ⓘ',`spellInfo(${arg})`,'small secondary')}${available?button('Utiliser',`castSpell(${arg})`,'small primary'):'<button type="button" disabled style="opacity:.75;cursor:not-allowed;background:#555;color:#ddd;border:0;border-radius:8px;padding:9px 12px">Impossible</button>'}</div>`}).join('')}${button('Ouvrir le grimoire',"tab='sorts';render()")}</div>`;html=html.replace('<div class="card"><div class="row"><h2>✨ Sorts</h2>',panel+'<div class="card"><div class="row"><h2>✨ Sorts</h2>');}return html};

function hitDieSize(){let c=String(data.cls||'').toLowerCase();if(/barbare/.test(c))return 12;if(/guerrier|paladin|rôdeur|rodeur/.test(c))return 10;if(/barde|clerc|druide|moine|roublard|occultiste|artificier/.test(c))return 8;if(/magicien|ensorceleur/.test(c))return 6;return 8}
function hitDiceSpent(){return Math.max(0,Math.min(data.level,Number(data.hitDiceSpent)||0))}
function restPanel(){let total=Math.max(1,Number(data.level)||1),left=total-hitDiceSpent();return '<div class="card"><h2>🌙 Repos</h2><p class="muted">Dés de vie : '+left+' / '+total+' (d'+hitDieSize()+') • PV : '+data.hp+' / '+data.maxHp+'</p><div class="row" style="flex-wrap:wrap">'+button('☀️ Repos court','openShortRest()','primary')+button('🌙 Repos long','openLongRest()','secondary')+'</div><p class="muted">Repos court : dépenser des dés de vie pour récupérer des PV. Repos long : récupérer tous les PV, les emplacements de sorts et une partie des dés de vie dépensés.</p></div>'}
function restTraits(){let c=String(data.cls||'').toLowerCase(),l=Number(data.level)||1,a=[];if(c.includes('guerrier'))a.push('Second souffle'+(l>=2?', Sursaut d’activité':''));if(c.includes('moine')&&l>=2)a.push('Points de ki');if(c.includes('druide')&&l>=2)a.push('Forme sauvage');if(c.includes('clerc')&&l>=2)a.push('Conduit divin');if(c.includes('paladin')&&l>=3)a.push('Conduit divin');if(c.includes('barde')&&l>=5)a.push('Inspiration bardique');if(c.includes('occultiste'))a.push('Emplacements de pacte');return a}
function shortRestClassNote(){let a=restTraits();return a.length?'<p class="muted">Capacités récupérées au repos court : '+a.join(', ')+'</p>':''}
function openShortRest(){let left=Math.max(0,data.level-hitDiceSpent()),die=hitDieSize(),con=mod(data.stats.CON);show('<h2>☀️ Repos court</h2><p class="muted">Lance tes dés de vie PHYSIQUES : '+left+' d'+die+' disponibles. Pour chaque dé, ajoute ton modificateur de Constitution ('+fmt(con)+'), minimum 0 PV par dé.</p><label>Nombre de dés de vie dépensés</label><div class="row" style="justify-content:center;gap:14px;margin:12px 0"><button type="button" style="min-width:55px;min-height:52px;font-size:25px" onclick="stepRestDice(-1)">−</button><strong id="restDiceCount" style="font-size:26px;min-width:45px;text-align:center">'+Math.min(1,left)+'</strong><button type="button" style="min-width:55px;min-height:52px;font-size:25px" onclick="stepRestDice(1)">+</button></div><input id="restDice" type="hidden" value="'+Math.min(1,left)+'"><div id="restDiceValues"></div><div class="row">'+button('Annuler','closeModal()','secondary')+button('Valider les résultats','rollShortRest()','primary')+'</div>');updateRestDiceInputs()}
function stepRestDice(delta){let el=document.getElementById('restDice');if(!el)return;let max=Math.max(0,data.level-hitDiceSpent());el.value=Math.max(0,Math.min(max,Number(el.value)+delta));document.getElementById('restDiceCount').textContent=el.value;updateRestDiceInputs()}
function updateRestDiceInputs(){let n=Math.max(0,Math.min(Math.max(0,data.level-hitDiceSpent()),Number(document.getElementById('restDice')?.value)||0)),die=hitDieSize(),target=document.getElementById('restDiceValues');if(!target)return;let previous=Array.from(target.querySelectorAll('input')).map(x=>x.value);target.innerHTML=n?'<p class="muted">Entre le résultat de chaque dé physique (sans le bonus de Constitution) :</p>'+Array.from({length:n},(_,i)=>'<label>Dé '+(i+1)+' (d'+die+')</label><input class="physicalRestDie" type="number" min="1" max="'+die+'" step="1" placeholder="Résultat du dé" value="'+(previous[i]||'')+'">').join(''):'<p class="muted">Aucun dé de vie dépensé.</p>'}
function rollShortRest(){let n=num('restDice'),left=Math.max(0,data.level-hitDiceSpent()),die=hitDieSize(),con=mod(data.stats.CON);if(!Number.isInteger(n)||n<0||n>left)return alert('Nombre de dés de vie invalide.');let fields=Array.from(document.querySelectorAll('.physicalRestDie'));if(fields.length!==n)return alert('Indique les résultats des dés.');let rolls=fields.map(x=>Number(x.value));if(rolls.some((v,i)=>!fields[i].value.trim()||!Number.isInteger(v)||v<1||v>die))return alert('Entre le résultat physique de chaque d'+die+' (entre 1 et '+die+').');let heals=rolls.map(v=>Math.max(0,v+con)),total=heals.reduce((a,b)=>a+b,0),effective=Math.min(total,Math.max(0,data.maxHp-data.hp));change(()=>{data.hitDiceSpent=hitDiceSpent()+n;data.hp=Math.min(data.maxHp,data.hp+total);log('Repos court : '+n+'d'+die+' physiques ('+rolls.join(', ')+'), CON '+fmt(con)+', '+effective+' PV récupérés')});if(isWizard()&&!data.arcaneRecoveryUsed&&Object.entries(data.slots||{}).some(([lv,x])=>Number(lv)<=5&&Number(lv)<=Math.ceil(data.level/2)&&x.used>0)){openArcaneRecovery();return}show('<h2>☀️ Repos court terminé</h2><p>Résultats des dés physiques : '+(rolls.join(', ')||'aucun')+'</p><p>Constitution : '+fmt(con)+' par dé</p><p><strong>PV récupérés : '+effective+'</strong></p><p class="muted">PV actuels : '+data.hp+' / '+data.maxHp+' • Dés de vie restants : '+(data.level-hitDiceSpent())+'</p>'+button('Terminer','closeModal()','primary'))}
function openLongRest(){let details=['Tous les PV récupérés','Dés de vie récupérés : jusqu’à la moitié du niveau (minimum 1)'];if(Object.values(data.slots||{}).some(x=>x.max>0))details.push('Tous les emplacements de sorts récupérés');if(isBarbarian())details.push('Toutes les utilisations de rage récupérées');show('<h2>🌙 Repos long</h2><p>'+details.join('<br>')+'</p><p class="muted">Aucun dé de vie à lancer pour ce repos.</p><div class="row">'+button('Annuler','closeModal()','secondary')+button('Confirmer le repos long','confirmLongRest()','primary')+'</div>')}
function confirmLongRest(){change(()=>{data.hp=data.maxHp;Object.values(data.slots||{}).forEach(x=>x.used=0);data.hitDiceSpent=Math.max(0,hitDiceSpent()-Math.max(1,Math.floor(data.level/2)));if(isBarbarian()){data.rageUsed=0;data.rageActive=false}data.concentration='';data.haste=false;data.tempAcBonus=0;data.mageArmor=false;data.arcaneRecoveryUsed=false;data.arcaneRecoveryPoints=0;log('Repos long terminé : récupération selon la classe')});closeModal();toast('Repos long terminé')}
let arcaneDraft={};
function arcaneBudget(){return Math.ceil(data.level/2)}
function arcaneSpent(){return Object.entries(arcaneDraft).reduce((sum,[lv,n])=>sum+Number(lv)*n,0)}
function openArcaneRecovery(){if(!isWizard()||data.arcaneRecoveryUsed)return;arcaneDraft={};renderArcaneRecovery()}
function renderArcaneRecovery(){let cap=arcaneBudget(),spent=arcaneSpent(),choices=Object.entries(data.slots||{}).filter(([lv,x])=>Number(lv)<=5&&Number(lv)<=cap&&x.used>0);show('<h2>☀️ Repos court — étape finale</h2><h3>✨ Restauration arcanique</h3><p class="muted">Choisis les emplacements à récupérer. Une fois par jour, après un repos court. Aucun emplacement de niveau 6 ou supérieur.</p><p><strong>Budget : '+spent+' / '+cap+' niveaux</strong></p>'+(choices.length?choices.map(([lv,x])=>{let n=arcaneDraft[lv]||0,max=Math.min(x.used,Math.floor(cap/Number(lv)));return '<div class="row" style="padding:10px 0;gap:10px;border-bottom:1px solid #ffffff22"><span style="flex:1">Sorts niveau '+lv+'<small class="muted" style="display:block">Maximum : '+max+' (dépensés : '+x.used+')</small></span><button type="button" style="min-width:44px;min-height:46px" onclick="stepArcane('+lv+',-1)">−</button><strong style="min-width:20px;text-align:center">'+n+'</strong><button type="button" style="min-width:44px;min-height:46px" onclick="stepArcane('+lv+',1)">+</button></div>'}).join(''):'<p class="muted">Aucun emplacement récupérable.</p>')+'<div class="row" style="margin-top:16px">'+button('Valider et terminer le repos court','confirmArcaneRecovery()','primary')+'</div>')}
function stepArcane(lv,delta){let slot=data.slots[String(lv)],n=arcaneDraft[lv]||0,next=n+delta;if(!slot||next<0||next>slot.used||arcaneSpent()+delta*lv>arcaneBudget())return;arcaneDraft[lv]=next;renderArcaneRecovery()}
function confirmArcaneRecovery(){let entries=Object.entries(arcaneDraft).filter(([lv,n])=>n>0);if(!entries.length)return toast('Choisis au moins un emplacement à récupérer');if(arcaneSpent()>arcaneBudget()||entries.some(([lv,n])=>Number(lv)>5||!data.slots[lv]||n>data.slots[lv].used))return alert('Choix invalide');change(()=>{entries.forEach(([lv,n])=>data.slots[lv].used-=n);data.arcaneRecoveryUsed=true;data.arcaneRecoveryPoints=0;log('Restauration arcanique : '+entries.map(([lv,n])=>n+' emplacement(s) niveau '+lv).join(', '))});closeModal();toast('Emplacements récupérés')}
const ficheBeforeRest=fiche;
fiche=function(){let html=ficheBeforeRest();let start=html.indexOf('<div class="card"><div class="row"><h2>✨ Sorts</h2>');if(start>=0){let end=html.indexOf('<div class="card">',start+20);html=html.slice(0,start)+(end>=0?html.slice(end):'')}let buttons='<div class="row" style="flex-wrap:wrap;margin-top:10px">'+button('☀️ Repos court','openShortRest()','small secondary')+button('🌙 Repos long','openLongRest()','small secondary')+'</div>';let first=html.indexOf('</div></div><div class="card">');if(first>=0)html=html.slice(0,first)+buttons+html.slice(first);return html};

function creatorRead(){if(!creationDraft)return;let d=creationDraft;for(let k of ['name','lastName','race','subrace','cls','subclass','background','alignment','notes','hpMode','hpOverride','skills','equipment','spells']){let e=document.getElementById('create_'+k);if(e)d[k]=e.value}let lv=document.getElementById('create_level');if(lv)d.level=Math.max(1,Math.min(20,Number(lv.value)||1));for(let k of Object.keys(d.stats)){let e=document.getElementById('create_'+k);if(e)d.stats[k]=Math.max(1,Math.min(30,Number(e.value)||10))}}

c(d.alignment)+'"></div><div class="card"><h2>🎲 Caractéristiques</h2><p class="muted">Entre les scores finaux après les bonus raciaux, obtenus avec tes dés ou une répartition de points. Les jets restent physiques.</p><div class="grid">'+Object.keys(d.stats).map(k=>'<div><label>'+k+'</label><input type="number" min="1" max="30" id="create_'+k+'" value="'+d.stats[k]+'"></div>').join('')+'</div><p class="muted">Les bonus raciaux ne sont pas ajoutés une seconde fois à ces scores finaux.</p><label>Points de vie</label><select id="create_hpMode"><option value="average" '+(d.hpMode==='average'?'selected':'')+'>Valeur fixe moyenne par niveau</option><option value="manual" '+(d.hpMode==='manual'?'selected':'')+'>Total de PV personnalisé</option></select><input id="create_hpOverride" type="number" min="1" placeholder="Total de PV personnalisé si choisi" value="'+esc(d.hpOverride)+'"><label>Classe d’armure de départ</label><input type="number" id="create_ac" min="1" max="40" value="'+d.ac+'"><p class="muted">La CA est ajustable selon armure, bouclier et capacités de classe.</p></div><div class="card"><h2>📜 Compétences, équipement et magie</h2><label>Compétences maîtrisées (séparées par des virgules)</label><textarea id="create_skills" rows="2" placeholder="Perception, Discrétion…">'+esc(d.skills)+'</textarea><label>Équipement de départ (un objet par ligne)</label><textarea id="create_equipment" rows="3" placeholder="Épée longue\nSac d’explorateur">'+esc(d.equipment)+'</textarea><label>Sorts connus / grimoire (un sort par ligne)</label><textarea id="create_spells" rows="3" placeholder="Pour les classes qui lancent des sorts">'+esc(d.spells)+'</textarea><label>Histoire et notes</label><textarea id="create_notes" rows="3">'+esc(d.notes)+'</textarea><p class="muted">Les sorts saisis sont enregistrés. Les choix automatiques complets de sorts, maîtrises et équipements selon chaque archétype restent à vérifier.</p><div class="row">'+button('Annuler','showFdcHome()','secondary')+butto function finishFdcCreation(){creatorRead();let d=creationDraft;if(!d.name.trim())return alert('Indique le nom de ton personnage.');if(!Number.isInteger(d.level)||d.level<1||d.level>20)return alert('Le niveau doit être compris entre 1 et 20.');let p=initial();p.name=d.name.trim();p.lastName=d.lastName.trim();p.race=d.race;p.subrace=d.subrace;p.cls=d.cls;p.subclass=d.subclass;p.level=d.level;p.edition='2014';p.background=d.background;p.alignment=d.alignment;p.stats={...d.stats};p.maxHp=d.hpMode==='manual'&&Number(d.hpOverride)>0?Math.round(Number(d.hpOverride)):creatorPreviewHp(d);p.hp=p.maxHp;p.ac=d.ac;p.portrait='';p.proficiencies=d.skills.split(',').map(x=>x.trim()).filter(Boolean);p.weapons=[];p.equipment=d.equipment.split('\n').map((name,i)=>({id:Date.now()+i,name:name.trim(),qty:1,equipped:false,notes:''})).filter(x=>x.name);p.bag=[];p.history=[];p.notes=d.notes;p.coins={pp:0,po:0,pe:0,pa:0,pc:0};p.gold=0;p.slots={};let spells=d.spells.split('\n').map(x=>x.trim()).filter(Boolean);if(d.cls==='Magicien'){p.spellbook=spells.filter(x=>spellLevel(x)>0);p.cantrips=spells.filter(x=>spellLevel(x)===0);p.preparedSpells=p.spellbook.slice(0,Math.max(1,d.level+Math.floor((d.stats.INT-10)/2)))}else p.knownSpells=spells;party.push(p);active=party.length-1;data=p;fdcScreen='sheet';tab='fiche';save();render();toast('Personnage créé !')}

const fdcCreatorOldHtml=fdcCreateHtml;

html=html.replace('<p class="muted">Étape '+(step+1)+' sur '+FDC_CREATOR_STEPS.length+' · '+FDC_CREATOR_STEPS[step]+'</p>','<p class="muted">Étape '+(step+1)+' sur '+FDC_CREATOR_STEPS.length+' · '+FDC_CREATOR_STEPS[step]+'</p><p class="muted">'+esc(fdcCreatorStepText())+'</p>');

const FDC_WEAPON_CHOICES=[
['Dague','1d4 perforants','simple'],['Bâton','1d6 contondants','simple'],['Masse','1d6 contondants','simple'],['Gourdin','1d4 contondants','simple'],['Lance','1d6 perforants','simple'],['Javeline','1d6 perforants','simple'],['Hachette','1d6 tranchants','simple'],['Arbalète légère','1d8 perforants','simple'],['Arc court','1d6 perforants','simple'],['Épée longue','1d8 tranchants','martiale'],['Épée courte','1d6 perforants','martiale'],['Rapière','1d8 perforants','martiale'],['Cimeterre','1d6 tranchants','martiale'],['Hache à deux mains','1d12 tranchants','martiale'],['Épée à deux mains','2d6 tranchants','martiale'],['Marteau de guerre','1d8 contondants','martiale'],['Arc long','1d8 perforants','martiale'],['Arbalète lourde','1d10 perforants','martiale']
];

function fdcCreatorGearInit(){let d=creationDraft;if(!Array.isArray(d.chosenWeapons))d.chosenWeapons=[];if(!d.chosenArmor)d.chosenArmor='Sans armure';if(typeof d.chosenShield!=='boolean')d.chosenShield=false}
function fdcCreatorGearAllowedWeapon(w){let p=FDC_GEAR_PROF[creationDraft.cls]||{};return w[2]==='simple'||p.martial||(p.extra||[]).includes(w[0])}
function fdcCreatorGearAllowedArmor(a){let p=FDC_GEAR_PROF[creationDraft.cls]||{};return a[1]==='aucune'||(p.arm||[]).includes(a[1])}
function fdcCreatorGearToggleWeapon(name){creatorRead();fdcCreatorGearInit();let arr=creationDraft.chosenWeapons;creationDraft.chosenWeapons=arr.includes(name)?arr.filter(x=>x!==name):[...arr,name];render()}
function fdcCreatorGearArmor(name){creatorRead();fdcCreatorGearInit();creationDraft.chosenArmor=name;render()}
function fdcCreatorGearShield(){creatorRead();fdcCreatorGearInit();creationDraft.chosenShield=!creationDraft.chosenShield;render()}
function fdcCreatorGearAC(){let d=creationDraft;fdcCreatorGearInit();let armor=FDC_ARMOR_CHOICES.find(x=>x[0]===d.chosenArmor)||FDC_ARMOR_CHOICES[0];let dex=Math.floor((d.stats.DEX-10)/2),ac=armor[2]===0?10+dex:armor[2]+(armor[1]==='lourde'?0:armor[1]==='intermédiaire'?Math.min(2,dex):dex);if(armor[2]===0&&d.cls==='Barbare')ac=10+dex+Math.floor((d.stats.CON-10)/2);if(armor[2]===0&&d.cls==='Moine')ac=10+dex+Math.floor((d.stats.SAG-10)/2);return ac+(d.chosenShield?2:0)}
function fdcCreatorGearHtml(){let d=creationDraft;fdcCreatorGearInit();let p=FDC_GEAR_PROF[d.cls]||{};let h='<div class="card"><h2>⚔️ Choisis tes armes</h2><p class="muted">Tu peux en sélectionner plusieurs. Les armes grisées ne font pas partie des maîtrises habituelles de ta classe, mais restent sélectionnables pour un personnage personnalisé.</p>';for(let w of FDC_WEAPON_CHOICES){let chosen=d.chosenWeapons.includes(w[0]),allowed=fdcCreatorGearAllowedWeapon(w);h+='<button type="button" class="'+(chosen?'primary':'secondary')+'" style="display:block;width:100%;padding:11px;margin:6px 0;text-align:left;white-space:normal;opacity:'+(allowed?1:.7)+'" onclick="fdcCreatorGearToggleWeapon('+JSON.stringify(w[0]).replace(/"/g,'&quot;')+')"><b>'+(chosen?'✓ ':'')+esc(w[0])+'</b><span style="font-size:12px;margin-left:8px">'+esc(w[1])+'</span><div style="font-size:11px;opacity:.85">'+(allowed?'Maîtrise de classe':'⚠ Pas de maîtrise de classe')+' · '+(w[2]==='simple'?'Arme courante':'Arme de guerre')+'</div></button>'}h+='</div><div class="card"><h2>🛡️ Choisis ton armure</h2><p class="muted">La classe d’armure est calculée à partir de ton équipement et de ta Dextérité. Attention : certaines classes perdent des avantages lorsqu’elles portent une armure.</p>';for(let a of FDC_ARMOR_CHOICES){let allowed=fdcCreatorGearAllowedArmor(a),chosen=d.chosenArmor===a[0];h+='<button type="button" class="'+(chosen?'primary':'secondary')+'" style="display:block;width:100%;padding:10px;margin:5px 0;text-align:left;white-space:normal;opacity:'+(allowed?1:.7)+'" onclick="fdcCreatorGearArmor('+JSON.stringify(a[0]).replace(/"/g,'&quot;')+')"><b>'+(chosen?'✓ ':'')+esc(a[0])+'</b> <span style="font-size:12px">'+(a[2]?'CA de base '+a[2]:'CA 10 + DEX')+'</span><div style="font-size:11px;opacity:.85">'+(allowed?'Maîtrise de classe':'⚠ Non maîtrisée')+'</div></button>'}h+='<button type="button" class="'+(d.chosenShield?'primary':'secondary')+'" style="width:100%;margin:9px 0" onclick="fdcCreatorGearShield()">'+(d.chosenShield?'✓ ':'')+'Bouclier (+2 CA)'+(p.shield?'':' ⚠ Non maîtrisé')+'</button><p><b>🛡️ CA estimée : '+fdcCreatorGearAC()+'</b></p><p class="muted">La CA peut varier selon les dons, la magie et les capacités particulières. Un bouclier n’est pas compatible avec certaines capacités du moine et du barbare.</p></div>';return h}
const fdcCreatorGearBase=fdcCreateHtml;
fdcCreateHtml=function(){let html=fdcCreatorGearBase();if(fdcCreatorStep!==7)return html;let i=html.indexOf('<label>Équipement (un objet par ligne)</label>');if(i<0)return html;let end=html.indexOf('<label>Notes et histoire</label>',i);if(end<0)return html;html=html.slice(0,i)+'<label>Autres objets et matériel (un par ligne)</label><textarea id="create_equipment" rows="3">'+esc(creationDraft.equipment)+'</textarea>'+html.slice(end);let marker='<div class="card"><div class="row">'+button('← Précédent','fdcCreatorMove(-1)','secondary');html=html.replace(marker,fdcCreatorGearHtml()+marker);return html};
const fdcCreatorGearFinish=finishFdcCreation;
finishFdcCreation=function(){fdcCreatorGearInit();let d=creationDraft;let gear=[...d.chosenWeapons,...(d.chosenArmor==='Sans armure'?[]:[d.chosenArmor]),...(d.chosenShield?['Bouclier']:[])];let others=d.equipment.split('\n').map(x=>x.trim()).filter(Boolean);d.equipment=[...new Set([...gear,...others])].join('\n');d.ac=fdcCreatorGearAC();fdcCreatorGearFinish();if(fdcScreen==='sheet'&&party[active]){let p=party[active];p.weapons=d.chosenWeapons.map((name,i)=>({id:Date.now()+i,name,qty:1,equipped:i===0,notes:(FDC_WEAPON_CHOICES.find(w=>w[0]===name)||[])[1]||''}));p.ac=d.ac;data=p;save();render()}};

function fdcAutoAC(){let d=creationDraft;fdcCreatorGearInit();let armor=FDC_ARMOR_CHOICES.find(a=>a[0]===d.chosenArmor)||FDC_ARMOR_CHOICES[0],dex=Math.floor((d.stats.DEX-10)/2),con=Math.floor((d.stats.CON-10)/2),wis=Math.floor((d.stats.SAG-10)/2),ac=10+dex,details=['Sans armure : 10 + modificateur de Dextérité'];if(armor[2]){ac=armor[2]+(armor[1]==='lourde'?0:armor[1]==='intermédiaire'?Math.min(2,dex):dex);details=[armor[0]+' : '+armor[2]+(armor[1]==='lourde'?'':armor[1]==='intermédiaire'?' + DEX (maximum +2)':' + DEX')]}else if(d.cls==='Barbare'){ac=10+dex+con;details=['Défense sans armure du barbare : 10 + DEX + CON']}else if(d.cls==='Moine'&&!d.chosenShield){ac=10+dex+wis;details=['Défense sans armure du moine : 10 + DEX + SAG']}if(d.chosenShield){ac+=2;details.push('Bouclier : +2');if(d.cls==='Moine'&&!armor[2])details.push('Le bouclier désactive la Défense sans armure du moine')}if(!fdcCreatorGearAllowedArmor(armor))details.push('Attention : armure non maîtrisée par la classe');if(d.chosenShield&&!(FDC_GEAR_PROF[d.cls]||{}).shield)details.push('Attention : bouclier non maîtrisé par la classe');return {ac,details}}
