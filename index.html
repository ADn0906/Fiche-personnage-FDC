<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>FDC — Fiche joueur (Test)</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f7;background:#101116}*{box-sizing:border-box}body{margin:0}header{padding:7px 12px;background:#181a21;border-bottom:1px solid #343641;position:sticky;top:0;z-index:2}.brand{font-size:11px;color:#ee8b91;font-weight:800;letter-spacing:2px}.heading{font-size:22px;font-weight:800;margin-top:3px}.sub{font-size:12px;color:#b3b7c2}.wrap{max-width:760px;margin:auto;padding:14px 14px 110px}.card{background:#20232d;border:1px solid #363946;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aeb3bf;font-size:13px}.big{font-size:27px;font-weight:800}.red{color:#f19a9f}.bar{height:11px;background:#493035;border-radius:20px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#dc626d}.btn,button{font:inherit;cursor:pointer;border:0;border-radius:11px;background:#a93241;color:white;font-weight:700;padding:11px 14px;min-height:43px}.secondary{background:#383c49}.ghost{background:#2b2e39;border:1px solid #4b5060}.small{min-height:36px;padding:7px 11px}.btn:disabled,button:disabled{opacity:.4}.tabs{position:fixed;bottom:0;left:0;right:0;background:#1a1c24;border-top:1px solid #3c3f4b;display:flex;justify-content:center;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:4}.tabs button{flex:1;max-width:150px;background:transparent;padding:8px 2px;color:#abb0bd;font-size:11px}.tabs button.active{color:white;background:#74313a}.tabs span{display:block;font-size:19px;margin-bottom:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#2c303b;border:1px solid #414652;padding:12px 3px;text-align:center;border-radius:13px;cursor:pointer}.stat.active{border-color:#e58b93;background:#4a303a}.stat strong{font-size:25px;display:block}.stat small{color:#c6cad2}.badge{font-size:10px;background:#813e45;border-radius:5px;padding:3px 5px;display:inline-block;margin-top:5px}.line{border-top:1px solid #414550;margin-top:12px;padding-top:12px}.item{border-radius:12px;background:#2b2e39;padding:12px;margin:9px 0}.itemname{font-weight:750}.count{display:flex;align-items:center;gap:10px}.count b{min-width:28px;text-align:center;font-size:20px}.count button{min-width:42px}input,select,textarea{background:#303440;border:1px solid #535866;color:white;padding:11px;border-radius:10px;font:inherit;width:100%;min-width:0}label{display:block;color:#c3c7d0;font-size:12px;margin:8px 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.hint{background:#2d2a32;border-left:3px solid #c96672;padding:11px;font-size:13px;color:#d5d2d8;border-radius:6px}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px;z-index:9}.dialog{background:#252832;border:1px solid #555866;border-radius:17px;padding:20px;width:min(440px,100%);max-height:85vh;overflow:auto}.dialog h2{margin-bottom:12px}.dialog .row{margin-top:15px}.pill{display:inline-block;padding:5px 8px;background:#4d323a;border-radius:20px;font-size:11px;color:#ffcad0}.check{display:flex;align-items:center;gap:10px;padding:8px 0}.check input{width:20px;height:20px}footer{text-align:center;color:#8f96a4;font-size:11px;margin:25px 0}#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#3d5948;color:white;border-radius:12px;padding:12px 16px;display:none;z-index:11;max-width:90%;text-align:center}
header .headinner{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px}header .headbrand{font-size:10px;font-weight:900;letter-spacing:.7px;color:#f2a1a7;white-space:nowrap}header .headperson{margin-left:auto;display:flex;align-items:center;gap:9px;background:transparent;padding:2px;min-height:42px;text-align:right}header .headname{font-size:15px;font-weight:800;max-width:185px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header .avatar{height:39px;width:39px;border-radius:50%;object-fit:cover;border:2px solid #b85d69;background:#343943;display:grid;place-items:center;font-size:21px;flex-shrink:0}header .tiny{font-size:9px;color:#aeb5c0}#photoInput{display:none}
.wrap{padding:8px 10px 95px;max-width:860px}.card{padding:11px;margin:8px 0;border-radius:12px}.item{padding:9px;margin:6px 0}.stat{padding:6px 2px;border-radius:10px}.stat strong{font-size:19px}.stat small{font-size:10px}.grid{gap:5px}h2{font-size:16px;margin-bottom:6px}.big{font-size:24px}.bar{margin:8px 0}.row{gap:6px}.count{gap:5px}.count button{min-width:36px}.coinrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.coin{display:flex;align-items:center;gap:4px;background:#323744;border-radius:8px;padding:6px 8px}.coin small{font-size:10px;color:#bfc5d0}.slotmini{display:flex;gap:6px;flex-wrap:wrap}.slotchip{display:flex;align-items:center;gap:5px;background:#30343d;border-radius:8px;padding:5px 7px;font-size:12px}.slotchip button{min-height:30px;padding:4px 8px}header{padding:4px 10px}header .avatar{height:34px;width:34px}header .headperson{min-height:35px}@media(max-width:390px){.card{padding:9px}.btn,button{padding:8px 9px;min-height:37px}.stat strong{font-size:18px}.count button{min-width:32px}} </style></head><body><header><div class="headinner"><div class="headbrand">🎲 FDC</div><button class="headperson" onclick="openCharacter()" aria-label="Afficher les informations du personnage"><div><div class="headname" id="headName">Aldren</div><div class="tiny">TEST • Toucher pour les détails</div></div><div class="avatar" id="headAvatar">🧙</div></button></div></header><input type="file" id="photoInput" accept="image/*" onchange="setPortrait(this)"><main class="wrap" id="app"></main><nav class="tabs" id="tabs"></nav><div id="modal" class="overlay hidden"></div><div id="toast"></div><script>
const KEY='fdc-personnage-test-v01';const skills={FOR:['Athlétisme'],DEX:['Acrobaties','Escamotage','Discrétion'],CON:[],INT:['Arcanes','Histoire','Investigation','Nature','Religion'],SAG:['Dressage','Intuition','Médecine','Perception','Survie'],CHA:['Tromperie','Intimidation','Représentation','Persuasion']};const names={FOR:'Force',DEX:'Dextérité',CON:'Constitution',INT:'Intelligence',SAG:'Sagesse',CHA:'Charisme'};const initial=()=>({name:'Aldren',portrait:'',race:'Humain',cls:'Magicien',edition:'2014',level:3,hp:17,maxHp:20,ac:12,gold:120,coins:{pp:0,po:120,pe:0,pa:0,pc:0},stats:{FOR:8,DEX:14,CON:14,INT:16,SAG:12,CHA:10},dis:[],adv:[],effect:'Rajeunissement magique',effectOn:false,proficiencies:['Arcanes','Histoire'],saveProf:['INT','SAG'],weapons:[{id:1,name:'Bâton',qty:1,equipped:true,notes:'1d6−1 / 1d8−1 (2 mains) • Toucher +1'},{id:2,name:'Arc long',qty:1,equipped:false,notes:'1d8 perforants'},{id:3,name:'Flèches',qty:27,equipped:false,notes:'Munitions'},{id:4,name:'Javelines',qty:4,equipped:false,notes:'1d6 perforants'}],bag:[{id:5,name:'Potion de soins',qty:2,type:'heal',value:50,notes:'2d4 + 2 PV'},{id:6,name:'Diamant',qty:1,type:'treasure',value:50,notes:'Pierre précieuse'}],slots:{1:{used:0,max:4},2:{used:0,max:2}},notes:'',history:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}if(!data.coins)data.coins={pp:0,po:Number(data.gold)||0,pe:0,pa:0,pc:0};let tab='fiche',selected=null;const app=document.getElementById('app');const modal=document.getElementById('modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mod=x=>Math.floor((x-10)/2),fmt=n=>n>=0?'+'+n:''+n;const PARTY_KEY='fdc-multipersonnages-preview-v1';let party=JSON.parse(localStorage.getItem(PARTY_KEY)||'null');let active=Number(localStorage.getItem(PARTY_KEY+'-active')||0);if(!Array.isArray(party)||!party.length){let b=initial();Object.assign(b,{name:'Borin',race:'Nain',cls:'Barbare',level:3,hp:35,maxHp:35,ac:15,stats:{FOR:16,DEX:14,CON:16,INT:8,SAG:12,CHA:10},slots:{},weapons:[{id:30,name:'Hache à deux mains',qty:1,equipped:true,notes:'1d12 tranchants'},{id:31,name:'Javelines',qty:4,equipped:false,notes:'1d6 perforants'}],bag:[],coins:{pp:0,po:20,pe:0,pa:0,pc:0},history:[],rageUsed:0,rageActive:false});party=[data,b];active=0}data=party[active]||party[0];
function save(){party[active]=data;localStorage.setItem(PARTY_KEY,JSON.stringify(party));localStorage.setItem(PARTY_KEY+'-active',String(active));localStorage.setItem(KEY,JSON.stringify(data))}
function openParty(){show('<h2>👥 Mes personnages</h2>'+party.map((p,i)=>'<div class="item"><div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.race)+' • '+esc(p.cls)+' • niveau '+p.level+'</div></div>'+button(i===active?'✓ Actif':'Jouer','switchParty('+i+')','small')+'</div></div>').join('')+button('+ Créer un personnage','newParty()','secondary'))}
function switchParty(i){if(!party[i])return;active=i;data=party[i];save();closeModal();tab='fiche';render()}
function newParty(){let name=prompt('Nom du personnage');if(!name||!name.trim())return;let p=initial();p.name=name.trim();p.portrait='';p.weapons=[];p.bag=[];p.history=[];p.coins={pp:0,po:0,pe:0,pa:0,pc:0};party.push(p);switchParty(party.length-1)}
function isBarbarian(){return /barbare/i.test(data.cls)}
function rageMax(){return data.level>=20?Infinity:data.level>=17?6:data.level>=12?5:data.level>=6?4:data.level>=3?3:2}
function rageDamage(){return data.level>=16?4:data.level>=9?3:2}
function rageWeaponLine(w){if(!isBarbarian()||!data.rageActive)return '';let name=String(w.name||'').toLowerCase(),notes=String(w.notes||'').toLowerCase(),ranged=/arc|arbalète|arbalete|fronde|sarbacane|pistolet|fusil|flèche|fleche|carreau|dard/.test(name),dex=/adresse|dextérité|dex|distance/.test(notes),eligible=!ranged&&!dex;return eligible?'<div style="margin-top:6px"><strong style="color:#ff9b55">🔥 Rage active : +'+rageDamage()+' dégâts</strong></div>':''}
function barbarianPanel(){if(!isBarbarian())return '';let max=rageMax(),used=data.rageUsed||0,active=!!data.rageActive;return '<div class="card" style="border:1px solid #a44b42"><h2>🔥 Rage du Barbare</h2><p class="muted">Rages restantes : <b>'+(max===Infinity?'∞':Math.max(0,max-used)+' / '+max)+'</b></p><div class="row">'+button(active?'🔥 Rage active — terminer':'🔥 Activer la rage','toggleRage()','primary')+'</div>'+(active?'<div class="item"><b>🔥 Rage active</b><p>+ '+rageDamage()+' dégâts aux attaques de mêlée utilisant la Force</p><p>Avantage aux tests et sauvegardes de Force</p><p>Résistance aux dégâts contondants, perforants et tranchants</p><p>Pas de sorts ni de concentration pendant la rage</p></div>':'')+'<div class="item"><b>⚔️ Attaques par action :</b> '+(data.level>=5?2:1)+'</div>'+(data.level>=2?'<div class="item"><b>Attaque téméraire</b><p class="muted">Avantage à tes attaques de mêlée avec Force ce tour ; les ennemis ont avantage contre toi jusqu’au prochain tour.</p></div>':'')+'<p class="hint">La rage dure jusqu’à 1 minute, sous réserve des conditions de maintien. Le joueur termine la rage manuellement.</p></div>'}
function toggleRage(){if(!isBarbarian())return;if(data.rageActive){change(()=>{data.rageActive=false;log('Fin de rage')});return}if((data.rageUsed||0)>=rageMax())return alert('Plus de rage disponible avant un repos long.');change(()=>{data.rageUsed=(data.rageUsed||0)+1;data.rageActive=true;data.concentration='';data.haste=false;log('Entrée en rage')})}
const CLASS_RULES={Barbare:'d12 • Rage, Défense sans armure • Attaque supplémentaire au niveau 5',Barde:'d8 • Inspiration bardique et sorts',Clerc:'d8 • Incantation divine, domaine',Druide:'d8 • Forme sauvage, sorts',Ensorceleur:'d6 • Origine magique, points de sorcellerie',Guerrier:'d10 • Second souffle, Sursaut d’activité',Magicien:'d6 • Grimoire, préparation, récupération arcanique',Moine:'d8 • Arts martiaux, ki',Occultiste:'d8 • Pacte, emplacements de pacte',Paladin:'d10 • Imposition des mains, châtiment divin',Rôdeur:'d10 • Exploration, sorts',Roublard:'d8 • Attaque sournoise, action rusée'};
const RACE_RULES={'Demi-orc':'Endurance implacable, Attaques sauvages, vision dans le noir','Drakéide':'Souffle draconique et résistance selon ascendance','Demi-elfe':'Ascendance féérique, polyvalence, vision dans le noir','Gnome':'Ruse gnome, vision dans le noir','Tieffelin':'Résistance au feu, héritage infernal, vision dans le noir','Nain':'Vision dans le noir, résistance au poison (selon sous-race)','Elfe':'Vision dans le noir, ascendance féérique (selon sous-race)','Humain':'Traits selon variante choisie'};
function classRacePanel(){let traits=[];let race=String(data.race||'').toLowerCase();if(/elfe|nain|gnome|demi-elfe|demi-orc|tieffelin/.test(race))traits.push('<div class="item"><b>Vision dans le noir</b><p class="muted">Vous voyez dans la pénombre à 18 m comme en lumière vive et dans les ténèbres comme en pénombre, sans distinguer les couleurs.</p></div>');return traits.length?'<div class="card"><h2>✨ Capacités</h2>'+traits.join('')+'</div>':''}
function isConsumableWeapon(w){let n=String(w.name||'').toLowerCase();return /flèche|fleche|carreau|munition|bille|balle|javel|dard|projectile|pierre de fronde|sarbacane|trait d.arbalète|trait d.arbalete|lance[- ]pierre/.test(n)||w.consumable===true}
function change(fn){fn();save();render()}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',2800)}function log(s){data.history.unshift(new Date().toLocaleString('fr-FR')+' — '+s);data.history=data.history.slice(0,40)}function count(item,collection,delta){change(()=>{item.qty=Math.max(0,(Number(item.qty)||0)+delta);if(item.qty===0&&Array.isArray(data[collection]))data[collection]=data[collection].filter(x=>x.id!==item.id)})}function render(){document.getElementById('headName').textContent=data.name||'Personnage';document.getElementById('headAvatar').innerHTML=data.portrait?'<img src="'+data.portrait+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="Portrait">':'🧙';document.getElementById('tabs').innerHTML=[['fiche','🛡️','Fiche'],['sac','🎒','Sac à dos'],['sorts','✨','Sorts'],['reglages','⚙️','Options']].map(([id,ic,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><span>${ic}</span>${n}</button>`).join('');app.innerHTML=({fiche:fiche,sac:sac,sorts:sorts,reglages:reglages})[tab]()}function button(label,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function fiche(){const stat=selected?data.stats[selected]:0,p=mod(stat),pr=2+Math.floor((data.level-1)/4);const ratio=Math.max(0,data.hp)/Math.max(1,data.maxHp);const hpColor=ratio<=.05?'#e0444e':ratio<=.5?'#efa34b':'#3abf78';return `<div class="card"><div class="row"><div><div class="muted">❤️ Points de vie</div><div class="big">${data.hp} <span class="muted">/ ${data.maxHp}</span></div></div><div style="text-align:right"><div class="muted">🛡️ Classe d’armure</div><div class="big">${effectiveAC()}</div>${activeACLabels()}</div></div><div class="bar"><div style="width:${Math.min(100,100*ratio)}%;background:${hpColor}"></div></div><div class="row">${button('− Dégâts',"openHP('damage')")}${button('+ Soins',"openHP('heal')")}${button('✎ PV / CA',"openHP('edit')")}</div></div><div class="card"><div class="row"><h2>Caractéristiques</h2>${button('✎ Modifier',"openStats()",'small secondary')}</div><div class="grid">${Object.keys(names).map(k=>`<div class="stat ${selected===k?'active':''}" onclick="selected=selected==='${k}'?null:'${k}';render()"><small>${k}</small><strong>${fmt(mod(data.stats[k]))}</strong><small>Score ${data.stats[k]}</small>${data.effectOn&&data.dis.includes(k)?'<div class="badge">Désavantage</div>':data.effectOn&&data.adv.includes(k)?'<div class="badge">Avantage</div>':''}</div>`).join('')}</div>${selected?`<div class="line"><h3>${names[selected]} — Sauvegarde ${fmt(p+(data.saveProf.includes(selected)?pr:0))}</h3><div class="muted">${data.saveProf.includes(selected)?'Maîtrise appliquée • ':''}Bonus de maîtrise : +${pr}</div>${skills[selected].length?skills[selected].map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #383c46"><span>${s}${data.proficiencies.includes(s)?' ★':''}</span><strong>${fmt(p+(data.proficiencies.includes(s)?pr:0))}</strong></div>`).join(''):'<p class="muted">Aucune compétence associée.</p>'}${data.effectOn&&data.dis.includes(selected)?'<p class="pill">Désavantage aux jets concernés</p>':''}</div>`:''}</div><div class="card"><div class="row"><h2>⚔️ Armes & munitions</h2>${button('+ Ajouter',"openAdd('weapons')",'small secondary')}</div>${data.weapons.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)} ${w.equipped?'✓':''}</div><div class="muted">${esc(w.notes||'')}</div>${rageWeaponLine(w)}</div>${button('✎',`openEdit('weapons',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:8px"><span class="muted">${isConsumableWeapon(w)?'Quantité':''}</span><div class="count">${isConsumableWeapon(w)?button('−',`updateQty('weapons',${w.id},-1)`,'small secondary')+'<b>'+w.qty+'</b>'+button('+',`updateQty('weapons',${w.id},1)`,'small secondary'):'<span class="muted">Arme équipée / conservée</span>'}</div></div></div>`).join('')}</div>${barbarianPanel()}${classRacePanel()}<div class="card"><div class="row"><h2>✨ Sorts</h2>${button('Voir tous les sorts',"tab='sorts';render()",'small secondary')}</div><p class="muted">Emplacements disponibles (démo) :</p><div class="slotmini">${Object.entries(data.slots).map(([lv,x])=>`<div class="slotchip">Niv. ${lv} : <b>${x.max-x.used}/${x.max}</b> ${button('−',`slot(${lv},1)`,'small secondary')}${button('+',`slot(${lv},-1)`,'small secondary')}</div>`).join('')}</div><p class="muted">Les sorts attribués à la classe seront ajoutés après validation de la base de règles.</p></div>`}function sac(){return `<div class="card"><div class="row"><div><h2>🎒 Sac à dos</h2><div class="muted">Objets, potions et trésors</div></div>${button('+ Ajouter',"openAdd('bag')")}</div></div><div class="card"><div class="row"><div><h2>💰 Bourse</h2><div class="coinrow">${[['pp','PP'],['po','PO'],['pe','PE'],['pa','PA'],['pc','PC']].map(([k,label])=>`<div class="coin"><b>${data.coins[k]||0}</b><small>${label}</small></div>`).join('')}</div></div>${button('✎ Modifier',"openGold()")}</div></div><div class="card"><h2>Inventaire</h2>${data.bag.length?data.bag.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)}</div><div class="muted">${esc(w.notes||'')} ${w.value!==''?'• Valeur estimée : '+esc(w.value)+' PO':''}</div></div>${button('✎',`openEdit('bag',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:10px"><div class="count">${button('−',`updateQty('bag',${w.id},-1)`,'small secondary')}<b>${w.qty}</b>${button('+',`updateQty('bag',${w.id},1)`,'small secondary')}</div><div style="display:flex;gap:6px">${['heal','consumable','food'].includes(w.type)?button('Utiliser',`openUse(${w.id})`,'small'):''}${button('Vendre',`openSale(${w.id})`,'small secondary')}</div></div></div>`).join(''):'<p class="muted">Ton sac est vide.</p>'}</div><div class="card"><h2>📝 Notes de butin</h2><textarea id="notes" rows="4" placeholder="Indices, origine des objets, descriptions…" oninput="data.notes=this.value;save()">${esc(data.notes)}</textarea></div>`}function sorts(){return `<div class="card"><h2>✨ Sorts et emplacements</h2><p class="hint">Cette version permet de tester le suivi des emplacements. Les listes officielles par classe, espèce, sous-classe et édition ne sont pas encore intégrées : aucun sort ne sera attribué automatiquement dans ce prototype.</p></div><div class="card">${Object.entries(data.slots).map(([lv,s])=>`<div class="item"><div class="row"><div><strong>Emplacements niveau ${lv}</strong><div class="muted">${s.max-s.used} / ${s.max} disponibles</div></div><div class="count">${button('−',`slot(${lv},1)`,'small secondary')}<b>${s.max-s.used}</b>${button('+',`slot(${lv},-1)`,'small secondary')}</div></div></div>`).join('')}${button('Repos long : récupérer les emplacements',"longRest()")}</div><div class="card"><h2>À intégrer dans la prochaine version</h2><p class="muted">Grimoire, sorts connus/préparés, capacités raciales, concentration et descriptions filtrées selon les règles 2014/2024.</p></div>`}function niveau(){return `<div class="card"><h2>⬆️ Progression</h2><div class="big">Niveau ${data.level} <span class="red">→ ${Math.min(20,data.level+1)}</span></div><p class="hint">Version test : montée de niveau simplifiée. Le moteur complet de progression par classe, espèce et édition n'est pas encore connecté. Les gains de capacités et de sorts doivent être vérifiés dans les règles.</p>${data.level<20?button('Tester la montée de niveau',"openLevel()"):''}</div><div class="card"><h2>Historique</h2>${data.history.length?data.history.map(x=>`<div class="line muted">${esc(x)}</div>`).join(''):'<p class="muted">Aucune modification enregistrée.</p>'}</div>`}function reglages(){return `<div class="card"><h2>⚙️ Personnage</h2>${button('Modifier identité et édition',"openCharacter()")}</div><div class="card"><h2>💾 Sauvegarde</h2><p class="muted">Les modifications sont conservées localement dans ce navigateur sur cet appareil. Elles ne se synchronisent pas entre appareils. Pour éviter toute perte, exporte une copie.</p><div class="row">${button('Exporter JSON',"exportData()")}${button('Importer JSON',"document.getElementById('importfile').click()",'secondary')}</div><input type="file" id="importfile" accept="application/json" class="hidden" onchange="importData(this)"></div><div class="card"><h2>Réinitialiser la démo</h2>${button('Remettre les données fictives',"resetDemo()",'secondary')}</div>`}function show(html){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="secondary" onclick="closeModal()">✕ Fermer</button></div>${html}</div>`}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}function num(id){return Number(document.getElementById(id).value)}function textval(id){return document.getElementById(id).value}function openHP(mode){if(mode==='edit'){show(`<h2>Modifier PV et CA</h2><label>PV actuels</label><input id="a" type="number" value="${data.hp}"><label>PV maximum</label><input id="b" type="number" value="${data.maxHp}"><label>Classe d'armure</label><input id="c" type="number" value="${data.ac}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer',`saveHP()`)}</div>`);return}show(`<h2>${mode==='heal'?'❤️ Soigner':'⚔️ Subir des dégâts'}</h2><p class="muted">Saisis le résultat de tes dés physiques ou les dégâts annoncés par le MJ.</p><label>${mode==='heal'?'PV récupérés':'Dégâts subis'}</label><input id="amount" type="number" min="0" value="5"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`applyHP('${mode}')`)}</div>`)}function saveHP(){let a=num('a'),b=num('b'),c=num('c');if(![a,b,c].every(Number.isFinite)||b<1||a<0||c<0)return alert('Valeurs invalides');change(()=>{data.maxHp=b;data.hp=Math.min(a,b);data.ac=c;log('PV / CA modifiés')});closeModal()}function applyHP(mode){let v=num('amount');if(!Number.isFinite(v)||v<0)return alert('Valeur invalide');change(()=>{data.hp=mode==='heal'?Math.min(data.maxHp,data.hp+v):Math.max(0,data.hp-v);log((mode==='heal'?'Soins':'Dégâts')+' : '+v)});closeModal()}function openStats(){show(`<h2>Modifier les caractéristiques</h2>${Object.keys(names).map(k=>`<div class="row"><label style="min-width:95px">${names[k]}</label><input id="st${k}" type="number" min="1" max="30" value="${data.stats[k]}"></div>`).join('')}<div class="line"><label>Nom de l'effet personnalisé</label><input id="effect" value="${esc(data.effect)}"><div class="check"><input type="checkbox" id="effectOn" ${data.effectOn?'checked':''}><label for="effectOn">Effet actif</label></div><p class="muted">Choisis les caractéristiques avec désavantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="dis${k}" ${data.dis.includes(k)?'checked':''}>${names[k]}</label>`).join('')}<p class="muted">Choisis les caractéristiques avec avantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="adv${k}" ${data.adv.includes(k)?'checked':''}>${names[k]}</label>`).join('')}</div><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveStats()')}</div>`)}function saveStats(){let vals=Object.fromEntries(Object.keys(names).map(k=>[k,num('st'+k)]));if(Object.values(vals).some(x=>!Number.isInteger(x)||x<1||x>30))return alert('Scores attendus de 1 à 30');change(()=>{data.stats=vals;data.effect=textval('effect');data.effectOn=document.getElementById('effectOn').checked;data.dis=Object.keys(names).filter(k=>document.getElementById('dis'+k).checked);data.adv=Object.keys(names).filter(k=>document.getElementById('adv'+k).checked);log('Caractéristiques / effets modifiés')});closeModal()}function updateQty(collection,id,delta){change(()=>{let x=data[collection].find(x=>x.id===id);if(!x)return;x.qty=Math.max(0,(Number(x.qty)||0)+delta);if(x.qty===0)data[collection]=data[collection].filter(item=>item.id!==id)})}function openAdd(collection){show(`<h2>${collection==='weapons'?'Ajouter une arme ou munition':'Ajouter au sac'}</h2><label>Nom</label><input id="n" placeholder="Ex. 12 flèches, potion, diamant…"><label>Quantité</label><input id="q" type="number" value="1" min="1">${collection==='bag'?'<label>Type</label><select id="type"><option value="other">Objet / trésor</option><option value="heal">Potion de soins</option><option value="consumable">Potion / consommable</option><option value="food">Nourriture / consommable</option></select><label>Valeur estimée en PO (facultatif)</label><input id="v" type="number" min="0" placeholder="Inconnue">':''}<label>Notes / effet</label><input id="note" placeholder="Description libre"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Ajouter',`addItem('${collection}')`)}</div><p class="muted">La dictée vocale peut utiliser le micro du clavier de ton téléphone.</p>`)}function addItem(collection){let n=textval('n').trim(),q=num('q');if(!n||!Number.isInteger(q)||q<1)return alert('Indique un nom et une quantité valide');let v=collection==='bag'?textval('v'):'';if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))return alert('Valeur invalide');change(()=>{data[collection].push({id:Date.now(),name:n,qty:q,notes:textval('note'),...(collection==='bag'?{type:textval('type'),value:v}:{equipped:false})});log('Ajout : '+n)});closeModal();toast('Objet ajouté')}function openEdit(collection,id){let w=data[collection].find(x=>x.id===id);if(!w)return;show(`<h2>Modifier l'objet</h2><label>Nom</label><input id="n" value="${esc(w.name)}"><label>Notes</label><input id="note" value="${esc(w.notes||'')}">${collection==='bag'?`<label>Valeur estimée en PO</label><input id="v" type="number" value="${esc(w.value??'')}"><label>Type</label><select id="type"><option value="other" ${w.type==='other'||w.type==='treasure'?'selected':''}>Objet / trésor</option><option value="heal" ${w.type==='heal'?'selected':''}>Potion de soins</option><option value="consumable" ${w.type==='consumable'?'selected':''}>Potion / consommable</option><option value="food" ${w.type==='food'?'selected':''}>Nourriture / consommable</option></select>`:`<label class="check"><input id="eq" type="checkbox" ${w.equipped?'checked':''}>Arme équipée</label>`}<div class="row">${button('Supprimer',`deleteItem('${collection}',${id})`,'secondary')}${button('Enregistrer',`saveItem('${collection}',${id})`)}</div>${button('Annuler','closeModal()','ghost')}`)}function saveItem(c,id){let n=textval('n').trim();if(!n)return alert('Nom requis');change(()=>{let w=data[c].find(x=>x.id===id);w.name=n;w.notes=textval('note');if(c==='bag'){w.value=textval('v');w.type=textval('type')}else w.equipped=document.getElementById('eq').checked});closeModal()}function deleteItem(c,id){if(!confirm('Supprimer cet objet ?'))return;change(()=>{data[c]=data[c].filter(x=>x.id!==id)});closeModal()}function openUse(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return toast('Objet épuisé');show(`<h2>🧪 Utiliser : ${esc(w.name)}</h2><p class="muted">Effet noté : ${esc(w.notes||'Non renseigné')}</p><p class="muted">Lance tes dés physiques si nécessaire. Si l'objet rend des PV, indique le total. Sinon, laisse 0.</p><label>PV récupérés</label><input id="heal" type="number" min="0" value="0"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`useHeal(${id})`)}</div>`)}function useHeal(id){let n=num('heal'),w=data.bag.find(x=>x.id===id);if(!w||w.qty<1||!Number.isFinite(n)||n<0)return alert('Valeur invalide');let actual=Math.min(n,Math.max(0,data.maxHp-data.hp));change(()=>{data.hp+=actual;w.qty--;if(w.qty===0)data.bag=data.bag.filter(item=>item.id!==id);log(w.name+' utilisée : '+actual+' PV récupérés')});closeModal();toast(actual?('+'+actual+' PV • objet décompté'):'Objet utilisé et décompté')}function openSale(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return;show(`<h2>💰 Vendre : ${esc(w.name)}</h2><p class="muted">Valeur estimée : ${esc(w.value||'inconnue')} PO par unité. Saisis le prix réellement obtenu auprès du marchand.</p><label>Quantité vendue (max ${w.qty})</label><input id="q" type="number" min="1" max="${w.qty}" value="1"><label>Prix total obtenu (PO)</label><input id="sale" type="number" min="0" value="${Number(w.value)||0}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Vendre',`sell(${id})`)}</div>`)}function sell(id){let q=num('q'),price=num('sale'),w=data.bag.find(x=>x.id===id);if(!w||!Number.isInteger(q)||q<1||q>w.qty||!Number.isFinite(price)||price<0)return alert('Quantité ou prix invalide');change(()=>{w.qty-=q;if(w.qty===0)data.bag=data.bag.filter(item=>item.id!==id);data.coins.po+=price;data.gold=data.coins.po;log('Vente '+q+' × '+w.name+' : +'+price+' PO')});closeModal();toast('+'+price+' PO dans la bourse')}function openGold(){show(`<h2>💰 Modifier la bourse</h2><p class="muted">PP : platine · PO : or · PE : électrum · PA : argent · PC : cuivre.</p>${[['pp','Platine'],['po','Or'],['pe','Électrum'],['pa','Argent'],['pc','Cuivre']].map(([k,n])=>`<label>Pièces de ${n}</label><input id="coin_${k}" type="number" min="0" step="1" value="${data.coins[k]||0}">`).join('')}<div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveGold()')}</div>`)}function saveGold(){let next={};for(let k of ['pp','po','pe','pa','pc']){let n=num('coin_'+k);if(!Number.isSafeInteger(n)||n<0)return alert('Montant invalide');next[k]=n}change(()=>{data.coins=next;data.gold=next.po;log('Bourse modifiée')});closeModal()}function slot(l,delta){change(()=>{let s=data.slots[l];s.used=Math.max(0,Math.min(s.max,s.used+delta))})}function longRest(){if(!confirm('Effectuer un repos long ?'))return;change(()=>{Object.values(data.slots).forEach(s=>s.used=0);data.hp=data.maxHp;data.rageUsed=0;data.rageActive=false;log('Repos long')});toast('Repos long terminé')}function setPortrait(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>4000000){alert('Choisis une image de moins de 4 Mo.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=260,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);change(()=>{data.portrait=c.toDataURL('image/jpeg',.75)});toast('Portrait enregistré')};img.src=reader.result};reader.readAsDataURL(file)}function openCharacter(){show(`<h2>👥 Personnages</h2>${button("Changer de personnage","closeModal();openParty()","secondary")}<h3>Informations du personnage</h3><div style="text-align:center;margin-bottom:10px"><div style="font-size:42px">${data.portrait?'<img src="'+data.portrait+'" style="width:85px;height:85px;object-fit:cover;border-radius:50%">':'🧙'}</div>${button('📷 Choisir une photo',"document.getElementById('photoInput').click()",'secondary small')}</div><p class="muted">Ces informations restent accessibles en touchant le portrait ou le nom en haut de la fiche.</p><label>Nom</label><input id="name" value="${esc(data.name)}"><label>Race / espèce</label><input id="race" value="${esc(data.race)}"><label>Classe</label><input id="cls" value="${esc(data.cls)}"><div class="row"><div><strong>Niveau ${data.level}</strong></div>${data.level<20?button("⬆ Monter de niveau","closeModal();openLevel()","small secondary"):""}</div><label>Édition</label><select id="edition"><option ${data.edition==='2014'?'selected':''}>2014</option><option ${data.edition==='2024'?'selected':''}>2024</option></select><p class="hint">Changer la classe ou l'édition ne recalcule pas encore les capacités et sorts dans cette démo.</p><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveCharacter()')}</div>`)}function saveCharacter(){change(()=>{data.name=textval('name');data.race=textval('race');data.cls=textval('cls');data.edition=textval('edition')});closeModal()}function openLevel(){show(`<h2>Passage niveau ${data.level} → ${data.level+1}</h2><p class="hint">Simulation manuelle : les choix de sorts et capacités de classe ne sont pas encore automatisés.</p><label>PV maximum gagnés (résultat de ton dé de vie + Constitution, ou valeur fixe)</label><input id="gain" type="number" min="1" value="5"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Valider le niveau',`levelUp()`)}</div>`)}function levelUp(){let g=num('gain');if(!Number.isInteger(g)||g<1||data.level>=20)return alert('Gain de PV invalide');change(()=>{data.level++;data.maxHp+=g;data.hp+=g;log('Passage au niveau '+data.level+' (+'+g+' PV max)')});closeModal();toast('Niveau '+data.level+' enregistré')}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fdc-personnage-'+data.name.replace(/[^a-z0-9-]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.stats||!d.bag||!d.weapons)throw Error();if(!confirm('Remplacer la fiche actuelle par cette sauvegarde ?'))return;data=d;save();render();toast('Fiche importée')}catch{alert('Fichier de sauvegarde non reconnu')}};r.readAsText(f)}function resetDemo(){if(!confirm('Effacer les données de test et repartir de zéro ?'))return;data=initial();save();render()}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

const WIZARD_SLOTS=[[0,0,0,0,0,0,0,0,0],[2,0,0,0,0,0,0,0,0],[3,0,0,0,0,0,0,0,0],[4,2,0,0,0,0,0,0,0],[4,3,0,0,0,0,0,0,0],[4,3,2,0,0,0,0,0,0],[4,3,3,0,0,0,0,0,0],[4,3,3,1,0,0,0,0,0],[4,3,3,2,0,0,0,0,0],[4,3,3,3,1,0,0,0,0],[4,3,3,3,2,0,0,0,0],[4,3,3,3,2,1,0,0,0],[4,3,3,3,2,1,0,0,0],[4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,0,0],[4,3,3,3,2,1,1,1,0],[4,3,3,3,2,1,1,1,0],[4,3,3,3,2,1,1,1,1],[4,3,3,3,3,1,1,1,1],[4,3,3,3,3,2,1,1,1],[4,3,3,3,3,2,2,1,1]];
function isWizard(){return /magicien/i.test(data.cls)}
function wizardInit(){if(!data.spellbook){data.spellbook=['Armure du mage','Bouclier','Missile magique','Mains brûlantes','Sommeil','Détection de la magie','Pas brumeux','Image miroir'];data.preparedSpells=['Armure du mage','Bouclier','Missile magique','Mains brûlantes','Pas brumeux','Image miroir'];data.cantrips=['Trait de feu','Prestidigitation','Main du mage'];save()}if(!Array.isArray(data.preparedSpells))data.preparedSpells=[];if(!Array.isArray(data.cantrips))data.cantrips=[];if(!data.slots)data.slots={};const table=WIZARD_SLOTS[Math.max(1,Math.min(20,data.level))];table.forEach((n,i)=>{const k=String(i+1);if(n>0){if(!data.slots[k])data.slots[k]={used:0,max:n};else {data.slots[k].max=n;data.slots[k].used=Math.min(n,data.slots[k].used||0)}}});}
function wizardMaxSpell(){return Math.min(9,Math.ceil(Math.max(1,Math.min(20,data.level))/2))}
function wizardBookMax(){return 6+2*Math.max(0,data.level-1)}
function wizardPreparedMax(){return Math.max(1,data.level+mod(data.stats.INT))}
function wizardCantripMax(){return data.level>=10?5:data.level>=4?4:3}
function spellLevel(name){return Number(Object.keys(WIZARD_SPELLS).find(k=>WIZARD_SPELLS[k].includes(name))||0)}
function spellAction(name,kind){wizardInit();if(kind!=='cantrip'&&spellLevel(name)>wizardMaxSpell())return toast('Niveau de sort non accessible');let list=kind==='cantrip'?'cantrips':'spellbook';change(()=>{if(data[list].includes(name)){data[list]=data[list].filter(x=>x!==name);if(kind!=='cantrip')data.preparedSpells=data.preparedSpells.filter(x=>x!==name)}else{if(kind==='cantrip'&&data.cantrips.length>=wizardCantripMax())return toast('Nombre maximal de tours de magie atteint');if(kind!=='cantrip'&&data.spellbook.length>=wizardBookMax())return toast('Maximum de sorts appris pour ce niveau');data[list].push(name)}})}
function spellPrepare(name){wizardInit();if(spellLevel(name)>wizardMaxSpell())return toast('Niveau de sort non accessible');if(!data.spellbook.includes(name))return;if(!data.preparedSpells.includes(name)&&data.preparedSpells.length>=wizardPreparedMax())return toast('Maximum de sorts préparés atteint');change(()=>{data.preparedSpells=data.preparedSpells.includes(name)?data.preparedSpells.filter(x=>x!==name):[...data.preparedSpells,name]})}
function spellInfo(name){let d=SPELL_DETAILS[name],lv=spellLevel(name);show(`<h2>✨ ${esc(name)}</h2><p class="muted">${lv===0?'Tour de magie':'Sort de niveau '+lv} • D&D 5e 2014</p>${d?`<p><b>${esc(d[0])}</b> • ${esc(d[1])} • Portée : ${esc(d[2])} • Durée : ${esc(d[3])}</p><div class="item">${esc(d[4])}</div>`:'<p class="muted">Ce sort est présent dans le catalogue. Son descriptif détaillé n’est pas encore renseigné dans cette version ; consulte les règles 2014 pour ses effets exacts.</p>'}<div class="row">${button('Fermer','closeModal()','secondary')}${isWizard()&&(data.cantrips.includes(name)||data.preparedSpells.includes(name))?button('✨ Lancer',`castSpell(${JSON.stringify(name).replace(/"/g,"&quot;")})`):''}</div>`)}
function effectiveAC(){let base=Number(data.ac)||10;if(data.mageArmor)base=Math.max(base,13+mod(data.stats.DEX));return base+(data.tempAcBonus||0)+(data.haste?2:0)}
function activeACLabels(){let tags=[];if(data.mageArmor)tags.push(['Armure du mage',Math.max(0,effectiveAC()-(data.tempAcBonus||0)-(data.haste?2:0)-(Number(data.ac)||10)),'mageArmor']);if(data.tempAcBonus)tags.push(['Bouclier',data.tempAcBonus,'tempAcBonus']);if(data.haste)tags.push(['Hâte',2,'haste']);return tags.map(([name,bonus,key])=>'<div style="font-size:12px;margin-top:5px;color:#c5e5d2">'+esc(name)+' '+(bonus?'+'+bonus+' CA':'actif')+' '+button('✕','removeACEffect(\''+key+'\')','small secondary')+'</div>').join('')}
function removeACEffect(key){if(!['mageArmor','tempAcBonus','haste'].includes(key))return;change(()=>{if(key==='tempAcBonus')data.tempAcBonus=0;else data[key]=false;if(key==='haste'&&data.concentration==='Hâte')data.concentration='';log('Effet terminé : '+key)})}
function castSpell(name){wizardInit();let lv=spellLevel(name);if(lv>0&&!data.preparedSpells.includes(name))return alert('Ce sort doit être préparé.');if(lv===0&&!data.cantrips.includes(name))return alert('Tour de magie non connu.');let slotLevel=lv;if(lv>0){let slot=data.slots[String(lv)];if(!slot||slot.used>=slot.max)return alert('Plus aucun emplacement de niveau '+lv+' disponible pour lancer '+name+'.');}let detail=SPELL_DETAILS[name];change(()=>{if(lv>0)data.slots[slotLevel].used++;if(detail&&['concentration','haste'].includes(detail[5]))data.concentration=name;if(detail&&detail[5]==='ac')data.tempAcBonus=5;if(detail&&detail[5]==='armor')data.mageArmor=true;if(detail&&detail[5]==='haste')data.haste=true;log('Sort lancé : '+name+(lv?' (emplacement '+slotLevel+')':''))});closeModal();let out='Sort lancé : '+name; if(detail&&detail[5]==='ac'){out+=' • Bonus temporaire de +5 CA jusqu’au début de ton prochain tour. Utilise « Fin du bonus » pour le retirer.'}if(detail&&detail[5]==='armor'){out+=' • Armure du mage activée (CA 13 + DEX sans armure).'}if(detail&&detail[5]==='haste'){out+=' • Hâte activée : +2 CA (concentration).'}if(detail&&detail[7])out+=' • Dés : '+detail[7];toast(out)}
function endMagicBuffs(){change(()=>{data.tempAcBonus=0;data.mageArmor=false;data.haste=false;data.concentration='';log('Effets magiques temporaires terminés')})}
function wizardDescription(name){const d=SPELL_DETAILS[name];if(!d)return '<div class="muted" style="margin-top:7px">Description détaillée à compléter et vérifier selon les règles D&D 5e 2014.</div>';return '<div class="muted" style="margin-top:7px;line-height:1.55"><b>'+esc(d[0])+'</b> · Incantation : '+esc(d[1])+' · Portée : '+esc(d[2])+' · Durée : '+esc(d[3])+'<div style="margin-top:5px;color:#e5e6ed">'+esc(d[4])+'</div></div>'}
function wizardEntry(n,l){let locked=l>wizardMaxSpell();let owned=l===0?data.cantrips.includes(n):data.spellbook.includes(n),prep=l===0?owned:data.preparedSpells.includes(n);let arg=JSON.stringify(n).replace(/"/g,'&quot;');return '<div class="item"><div class="row"><div style="flex:1;min-width:0"><b>'+esc(n)+'</b><div class="muted">'+(l?'Niveau '+l:'Tour de magie')+(prep?' • ✓ Prêt':owned?' • Grimoire':'')+'</div></div>'+button(owned?'−':'＋','spellAction('+arg+',\''+(l?'spell':'cantrip')+'\')','small secondary')+(l&&owned?button(prep?'✓':'Préparer','spellPrepare('+arg+')','small secondary'):'')+'</div>'+(locked?'<div class="muted">🔒 Accessible au niveau de personnage '+(l*2-1)+'</div>':'')+wizardDescription(n)+'</div>'}
function wizardRows(){let f=window.wizardFilter??-1,q=(window.wizardSearch||'').toLocaleLowerCase('fr');return Object.entries(WIZARD_SPELLS).filter(([lv])=>f===-1||Number(lv)===f).map(([lv,ns])=>{let names=ns.filter(n=>n.toLocaleLowerCase('fr').includes(q));return names.length?'<h3 style="margin:18px 0 8px">'+(Number(lv)?'Sorts de niveau '+lv:'Tours de magie')+'</h3>'+names.map(n=>wizardEntry(n,Number(lv))).join(''):''}).join('')||'<p class="muted">Aucun sort trouvé.</p>'}
function wizardShort(n){let d=SPELL_DETAILS[n];return d?esc(d[4]):'Effet détaillé à compléter selon les règles D&D 5e 2014.'}
function wizardPanel(){if(!isWizard())return '';wizardInit();let can=data.cantrips||[],pre=data.preparedSpells||[],known=data.spellbook||[],max=wizardMaxSpell();let levels=Array.from({length:max+1},(_,i)=>i);let owned=(l)=>l===0?can:known;let group=levels.map(l=>{let ns=(WIZARD_SPELLS[l]||[]).filter(n=>owned(l).includes(n));return ns.length?'<h3 style="margin:16px 0 7px">Niveau '+l+'</h3>'+ns.map(n=>{let prepared=l===0||pre.includes(n);let arg=JSON.stringify(n).replace(/"/g,'&quot;');return '<div class="item" style="background:#2b2e39;border-radius:13px;padding:14px;margin:7px 0"><div class="row"><strong style="flex:1">'+esc(n)+'</strong>'+ (l?button(prepared?'✓ Préparé':'Préparer','spellPrepare('+arg+')','small '+(prepared?'primary':'secondary'))+(prepared?button('Utiliser','castSpell('+arg+')','small primary'):''):button('Utiliser','castSpell('+arg+')','small primary'))+'</div><p class="muted" style="margin:14px 0 3px;line-height:1.5">'+wizardShort(n)+'</p></div>'}).join(''):''}).join('');let catalogue=levels.map(l=>'<details style="margin:7px 0"><summary style="cursor:pointer;padding:5px 0">Niveau '+l+'</summary><div style="padding:7px 0">'+(WIZARD_SPELLS[l]||[]).map(n=>{let arg=JSON.stringify(n).replace(/"/g,'&quot;'),has=owned(l).includes(n);return '<div class="item" style="margin:7px 0;padding:12px;border-radius:10px"><div class="row"><b style="flex:1">'+esc(n)+'</b>'+button(has?'✓ Appris':'Apprendre','spellAction('+arg+',\''+(l?'spell':'cantrip')+'\')','small '+(has?'secondary':'primary'))+'</div><p class="muted" style="margin:9px 0 0">'+wizardShort(n)+'</p></div>'}).join('')+'</div></details>').join('');return '<div class="card"><h2>📖 Grimoire du magicien</h2><p class="muted">Tours de magie : '+can.length+'/'+wizardCantripMax()+' • Sorts préparés : '+pre.length+'/'+wizardPreparedMax()+' • Niveaux accessibles : 0 à '+max+'</p><p class="muted">Sorts appris : '+known.length+'/'+wizardBookMax()+' (6 au niveau 1, puis 2 par niveau). Choisis tes sorts dans le catalogue, puis prépare-les.</p>'+ (group||'<p class="muted">Aucun sort inscrit dans le grimoire.</p>')+'</div><div class="card"><h3>🔎 Catalogue</h3>'+catalogue+'</div>'}
const oldSorts=sorts;
sorts=function(){if(isWizard())wizardInit();let slotHtml=Object.entries(data.slots||{}).map(([lv,slot])=>`<div class="item"><div class="row"><span>Emplacements niv. ${lv}</span><strong>${Math.max(0,slot.max-slot.used)} / ${slot.max}</strong><span class="muted">${slot.used} utilisé${slot.used>1?'s':''}</span></div></div>`).join('');return `<div class="card"><h2>✨ Sorts & emplacements</h2>${slotHtml||'<p class="muted">Aucun emplacement pour cette classe.</p>'}</div>${isWizard()?wizardPanel():'<div class="card"><p class="muted">Les listes de sorts de cette classe ne sont pas encore automatisées. Aucun sort de magicien n’est attribué à une autre classe.</p></div>'}${data.concentration?`<div class="card">Concentration : ${esc(data.concentration)} ${button('Terminer','endMagicBuffs()','small secondary')}</div>`:''}`};
const originalFiche=fiche;
fiche=function(){if(isWizard())wizardInit();let html=originalFiche();if(isWizard()){let panel=`<div class="card"><div class="row" style="align-items:flex-start;flex-wrap:wrap"><h2 style="margin:0">✨ Sorts</h2><div class="muted" style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">${Object.entries(data.slots||{}).filter(([lv,x])=>x.max>0).map(([lv,x])=>`<span class="slotchip">Niv. ${lv} : <b>${Math.max(0,x.max-x.used)}/${x.max}</b></span>`).join('')}</div></div>${[...(data.cantrips||[]),...(data.preparedSpells||[])].map(n=>{let lv=spellLevel(n),slot=data.slots&&data.slots[String(lv)],available=lv===0||!!(slot&&slot.max>slot.used),arg=JSON.stringify(n).replace(/"/g,'&quot;');return `<div class="row" style="padding:9px 7px;gap:7px;flex-wrap:wrap;border-bottom:1px solid #ffffff16;${available?'':'opacity:.48;background:#24242b;border-radius:8px;'}"><span style="flex:1;min-width:125px"><strong>${esc(n)}</strong><span class="muted" style="display:block;font-size:12px">${lv===0?'Tour de magie':'Niveau '+lv}</span></span>${button('ⓘ',`spellInfo(${arg})`,'small secondary')}${available?button('Utiliser',`castSpell(${arg})`,'small primary'):'<button type="button" disabled style="opacity:.75;cursor:not-allowed;background:#555;color:#ddd;border:0;border-radius:8px;padding:9px 12px">Impossible</button>'}</div>`}).join('')}${button('Ouvrir le grimoire',"tab='sorts';render()")}</div>`;html=html.replace('<div class="card"><div class="row"><h2>✨ Sorts</h2>',panel+'<div class="card"><div class="row"><h2>✨ Sorts</h2>');}return html};

function hitDieSize(){let c=String(data.cls||'').toLowerCase();if(/barbare/.test(c))return 12;if(/guerrier|paladin|rôdeur|rodeur/.test(c))return 10;if(/barde|clerc|druide|moine|roublard|occultiste|artificier/.test(c))return 8;if(/magicien|ensorceleur/.test(c))return 6;return 8}
function hitDiceSpent(){return Math.max(0,Math.min(data.level,Number(data.hitDiceSpent)||0))}
function restPanel(){let total=Math.max(1,Number(data.level)||1),left=total-hitDiceSpent();return '<div class="card"><h2>🌙 Repos</h2><p class="muted">Dés de vie : '+left+' / '+total+' (d'+hitDieSize()+') • PV : '+data.hp+' / '+data.maxHp+'</p><div class="row" style="flex-wrap:wrap">'+button('☀️ Repos court','openShortRest()','primary')+button('🌙 Repos long','openLongRest()','secondary')+'</div><p class="muted">Repos court : dépenser des dés de vie pour récupérer des PV. Repos long : récupérer tous les PV, les emplacements de sorts et une partie des dés de vie dépensés.</p></div>'}
function restTraits(){let c=String(data.cls||'').toLowerCase(),l=Number(data.level)||1,a=[];if(c.includes('guerrier'))a.push('Second souffle'+(l>=2?', Sursaut d’activité':''));if(c.includes('moine')&&l>=2)a.push('Points de ki');if(c.includes('druide')&&l>=2)a.push('Forme sauvage');if(c.includes('clerc')&&l>=2)a.push('Conduit divin');if(c.includes('paladin')&&l>=3)a.push('Conduit divin');if(c.includes('barde')&&l>=5)a.push('Inspiration bardique');if(c.includes('occultiste'))a.push('Emplacements de pacte');return a}
function shortRestClassNote(){let a=restTraits();return a.length?'<p class="muted">Capacités récupérées au repos court : '+a.join(', ')+'</p>':''}
function openShortRest(){let left=Math.max(0,data.level-hitDiceSpent()),die=hitDieSize(),con=mod(data.stats.CON);show('<h2>☀️ Repos court</h2><p class="muted">Lance tes dés de vie PHYSIQUES : '+left+' d'+die+' disponibles. Pour chaque dé, ajoute ton modificateur de Constitution ('+fmt(con)+'), minimum 0 PV par dé.</p><label>Nombre de dés de vie dépensés</label><div class="row" style="justify-content:center;gap:14px;margin:12px 0"><button type="button" style="min-width:55px;min-height:52px;font-size:25px" onclick="stepRestDice(-1)">−</button><strong id="restDiceCount" style="font-size:26px;min-width:45px;text-align:center">'+Math.min(1,left)+'</strong><button type="button" style="min-width:55px;min-height:52px;font-size:25px" onclick="stepRestDice(1)">+</button></div><input id="restDice" type="hidden" value="'+Math.min(1,left)+'"><div id="restDiceValues"></div><div class="row">'+button('Annuler','closeModal()','secondary')+button('Valider les résultats','rollShortRest()','primary')+'</div>');updateRestDiceInputs()}
function stepRestDice(delta){let el=document.getElementById('restDice');if(!el)return;let max=Math.max(0,data.level-hitDiceSpent());el.value=Math.max(0,Math.min(max,Number(el.value)+delta));document.getElementById('restDiceCount').textContent=el.value;updateRestDiceInputs()}
function updateRestDiceInputs(){let n=Math.max(0,Math.min(Math.max(0,data.level-hitDiceSpent()),Number(document.getElementById('restDice')?.value)||0)),die=hitDieSize(),target=document.getElementById('restDiceValues');if(!target)return;let previous=Array.from(target.querySelectorAll('input')).map(x=>x.value);target.innerHTML=n?'<p class="muted">Entre le résultat de chaque dé physique (sans le bonus de Constitution) :</p>'+Array.from({length:n},(_,i)=>'<label>Dé '+(i+1)+' (d'+die+')</label><input class="physicalRestDie" type="number" min="1" max="'+die+'" step="1" placeholder="Résultat du dé" value="'+(previous[i]||'')+'">').join(''):'<p class="muted">Aucun dé de vie dépensé.</p>'}
function rollShortRest(){let n=num('restDice'),left=Math.max(0,data.level-hitDiceSpent()),die=hitDieSize(),con=mod(data.stats.CON);if(!Number.isInteger(n)||n<0||n>left)return alert('Nombre de dés de vie invalide.');let fields=Array.from(document.querySelectorAll('.physicalRestDie'));if(fields.length!==n)return alert('Indique les résultats des dés.');let rolls=fields.map(x=>Number(x.value));if(rolls.some((v,i)=>!fields[i].value.trim()||!Number.isInteger(v)||v<1||v>die))return alert('Entre le résultat physique de chaque d'+die+' (entre 1 et '+die+').');let heals=rolls.map(v=>Math.max(0,v+con)),total=heals.reduce((a,b)=>a+b,0),effective=Math.min(total,Math.max(0,data.maxHp-data.hp));change(()=>{data.hitDiceSpent=hitDiceSpent()+n;data.hp=Math.min(data.maxHp,data.hp+total);log('Repos court : '+n+'d'+die+' physiques ('+rolls.join(', ')+'), CON '+fmt(con)+', '+effective+' PV récupérés')});if(isWizard()&&!data.arcaneRecoveryUsed&&Object.entries(data.slots||{}).some(([lv,x])=>Number(lv)<=5&&Number(lv)<=Math.ceil(data.level/2)&&x.used>0)){openArcaneRecovery();return}show('<h2>☀️ Repos court terminé</h2><p>Résultats des dés physiques : '+(rolls.join(', ')||'aucun')+'</p><p>Constitution : '+fmt(con)+' par dé</p><p><strong>PV récupérés : '+effective+'</strong></p><p class="muted">PV actuels : '+data.hp+' / '+data.maxHp+' • Dés de vie restants : '+(data.level-hitDiceSpent())+'</p>'+button('Terminer','closeModal()','primary'))}
function openLongRest(){let details=['Tous les PV récupérés','Dés de vie récupérés : jusqu’à la moitié du niveau (minimum 1)'];if(Object.values(data.slots||{}).some(x=>x.max>0))details.push('Tous les emplacements de sorts récupérés');if(isBarbarian())details.push('Toutes les utilisations de rage récupérées');show('<h2>🌙 Repos long</h2><p>'+details.join('<br>')+'</p><p class="muted">Aucun dé de vie à lancer pour ce repos.</p><div class="row">'+button('Annuler','closeModal()','secondary')+button('Confirmer le repos long','confirmLongRest()','primary')+'</div>')}
function confirmLongRest(){change(()=>{data.hp=data.maxHp;Object.values(data.slots||{}).forEach(x=>x.used=0);data.hitDiceSpent=Math.max(0,hitDiceSpent()-Math.max(1,Math.floor(data.level/2)));if(isBarbarian()){data.rageUsed=0;data.rageActive=false}data.concentration='';data.haste=false;data.tempAcBonus=0;data.mageArmor=false;data.arcaneRecoveryUsed=false;data.arcaneRecoveryPoints=0;log('Repos long terminé : récupération selon la classe')});closeModal();toast('Repos long terminé')}
let arcaneDraft={};
function arcaneBudget(){return Math.ceil(data.level/2)}
function arcaneSpent(){return Object.entries(arcaneDraft).reduce((sum,[lv,n])=>sum+Number(lv)*n,0)}
function openArcaneRecovery(){if(!isWizard()||data.arcaneRecoveryUsed)return;arcaneDraft={};renderArcaneRecovery()}
function renderArcaneRecovery(){let cap=arcaneBudget(),spent=arcaneSpent(),choices=Object.entries(data.slots||{}).filter(([lv,x])=>Number(lv)<=5&&Number(lv)<=cap&&x.used>0);show('<h2>☀️ Repos court — étape finale</h2><h3>✨ Restauration arcanique</h3><p class="muted">Choisis les emplacements à récupérer. Une fois par jour, après un repos court. Aucun emplacement de niveau 6 ou supérieur.</p><p><strong>Budget : '+spent+' / '+cap+' niveaux</strong></p>'+(choices.length?choices.map(([lv,x])=>{let n=arcaneDraft[lv]||0,max=Math.min(x.used,Math.floor(cap/Number(lv)));return '<div class="row" style="padding:10px 0;gap:10px;border-bottom:1px solid #ffffff22"><span style="flex:1">Sorts niveau '+lv+'<small class="muted" style="display:block">Maximum : '+max+' (dépensés : '+x.used+')</small></span><button type="button" style="min-width:44px;min-height:46px" onclick="stepArcane('+lv+',-1)">−</button><strong style="min-width:20px;text-align:center">'+n+'</strong><button type="button" style="min-width:44px;min-height:46px" onclick="stepArcane('+lv+',1)">+</button></div>'}).join(''):'<p class="muted">Aucun emplacement récupérable.</p>')+'<div class="row" style="margin-top:16px">'+button('Valider et terminer le repos court','confirmArcaneRecovery()','primary')+'</div>')}
function stepArcane(lv,delta){let slot=data.slots[String(lv)],n=arcaneDraft[lv]||0,next=n+delta;if(!slot||next<0||next>slot.used||arcaneSpent()+delta*lv>arcaneBudget())return;arcaneDraft[lv]=next;renderArcaneRecovery()}
function confirmArcaneRecovery(){let entries=Object.entries(arcaneDraft).filter(([lv,n])=>n>0);if(!entries.length)return toast('Choisis au moins un emplacement à récupérer');if(arcaneSpent()>arcaneBudget()||entries.some(([lv,n])=>Number(lv)>5||!data.slots[lv]||n>data.slots[lv].used))return alert('Choix invalide');change(()=>{entries.forEach(([lv,n])=>data.slots[lv].used-=n);data.arcaneRecoveryUsed=true;data.arcaneRecoveryPoints=0;log('Restauration arcanique : '+entries.map(([lv,n])=>n+' emplacement(s) niveau '+lv).join(', '))});closeModal();toast('Emplacements récupérés')}
const ficheBeforeRest=fiche;
fiche=function(){let html=ficheBeforeRest();let start=html.indexOf('<div class="card"><div class="row"><h2>✨ Sorts</h2>');if(start>=0){let end=html.indexOf('<div class="card">',start+20);html=html.slice(0,start)+(end>=0?html.slice(end):'')}let buttons='<div class="row" style="flex-wrap:wrap;margin-top:10px">'+button('☀️ Repos court','openShortRest()','small secondary')+button('🌙 Repos long','openLongRest()','small secondary')+'</div>';let first=html.indexOf('</div></div><div class="card">');if(first>=0)html=html.slice(0,first)+buttons+html.slice(first);return html};

render();
</script></body></html>
