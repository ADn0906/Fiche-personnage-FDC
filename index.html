<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101116"><title>FDC — Fiche joueur (Test)</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f5f7;background:#101116}*{box-sizing:border-box}body{margin:0}header{padding:7px 12px;background:#181a21;border-bottom:1px solid #343641;position:sticky;top:0;z-index:2}.brand{font-size:11px;color:#ee8b91;font-weight:800;letter-spacing:2px}.heading{font-size:22px;font-weight:800;margin-top:3px}.sub{font-size:12px;color:#b3b7c2}.wrap{max-width:760px;margin:auto;padding:14px 14px 110px}.card{background:#20232d;border:1px solid #363946;border-radius:16px;padding:15px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:#aeb3bf;font-size:13px}.big{font-size:27px;font-weight:800}.red{color:#f19a9f}.bar{height:11px;background:#493035;border-radius:20px;overflow:hidden;margin:12px 0}.bar>div{height:100%;background:#dc626d}.btn,button{font:inherit;cursor:pointer;border:0;border-radius:11px;background:#a93241;color:white;font-weight:700;padding:11px 14px;min-height:43px}.secondary{background:#383c49}.ghost{background:#2b2e39;border:1px solid #4b5060}.small{min-height:36px;padding:7px 11px}.btn:disabled,button:disabled{opacity:.4}.tabs{position:fixed;bottom:0;left:0;right:0;background:#1a1c24;border-top:1px solid #3c3f4b;display:flex;justify-content:center;padding:7px 4px max(8px,env(safe-area-inset-bottom));z-index:4}.tabs button{flex:1;max-width:150px;background:transparent;padding:8px 2px;color:#abb0bd;font-size:11px}.tabs button.active{color:white;background:#74313a}.tabs span{display:block;font-size:19px;margin-bottom:2px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#2c303b;border:1px solid #414652;padding:12px 3px;text-align:center;border-radius:13px;cursor:pointer}.stat.active{border-color:#e58b93;background:#4a303a}.stat strong{font-size:25px;display:block}.stat small{color:#c6cad2}.badge{font-size:10px;background:#813e45;border-radius:5px;padding:3px 5px;display:inline-block;margin-top:5px}.line{border-top:1px solid #414550;margin-top:12px;padding-top:12px}.item{border-radius:12px;background:#2b2e39;padding:12px;margin:9px 0}.itemname{font-weight:750}.count{display:flex;align-items:center;gap:10px}.count b{min-width:28px;text-align:center;font-size:20px}.count button{min-width:42px}input,select,textarea{background:#303440;border:1px solid #535866;color:white;padding:11px;border-radius:10px;font:inherit;width:100%;min-width:0}label{display:block;color:#c3c7d0;font-size:12px;margin:8px 0 5px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.hidden{display:none!important}h2{font-size:18px;margin:0 0 10px}h3{font-size:15px;margin:0 0 8px}.hint{background:#2d2a32;border-left:3px solid #c96672;padding:11px;font-size:13px;color:#d5d2d8;border-radius:6px}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:15px;z-index:9}.dialog{background:#252832;border:1px solid #555866;border-radius:17px;padding:20px;width:min(440px,100%);max-height:85vh;overflow:auto}.dialog h2{margin-bottom:12px}.dialog .row{margin-top:15px}.pill{display:inline-block;padding:5px 8px;background:#4d323a;border-radius:20px;font-size:11px;color:#ffcad0}.check{display:flex;align-items:center;gap:10px;padding:8px 0}.check input{width:20px;height:20px}footer{text-align:center;color:#8f96a4;font-size:11px;margin:25px 0}#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#3d5948;color:white;border-radius:12px;padding:12px 16px;display:none;z-index:11;max-width:90%;text-align:center}
header .headinner{max-width:760px;margin:auto;display:flex;align-items:center;gap:10px}header .headbrand{font-size:10px;font-weight:900;letter-spacing:.7px;color:#f2a1a7;white-space:nowrap}header .headperson{margin-left:auto;display:flex;align-items:center;gap:9px;background:transparent;padding:2px;min-height:42px;text-align:right}header .headname{font-size:15px;font-weight:800;max-width:185px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header .avatar{height:39px;width:39px;border-radius:50%;object-fit:cover;border:2px solid #b85d69;background:#343943;display:grid;place-items:center;font-size:21px;flex-shrink:0}header .tiny{font-size:9px;color:#aeb5c0}#photoInput{display:none}
.wrap{padding:8px 10px 95px;max-width:860px}.card{padding:11px;margin:8px 0;border-radius:12px}.item{padding:9px;margin:6px 0}.stat{padding:6px 2px;border-radius:10px}.stat strong{font-size:19px}.stat small{font-size:10px}.grid{gap:5px}h2{font-size:16px;margin-bottom:6px}.big{font-size:24px}.bar{margin:8px 0}.row{gap:6px}.count{gap:5px}.count button{min-width:36px}.coinrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}.coin{display:flex;align-items:center;gap:4px;background:#323744;border-radius:8px;padding:6px 8px}.coin small{font-size:10px;color:#bfc5d0}.slotmini{display:flex;gap:6px;flex-wrap:wrap}.slotchip{display:flex;align-items:center;gap:5px;background:#30343d;border-radius:8px;padding:5px 7px;font-size:12px}.slotchip button{min-height:30px;padding:4px 8px}header{padding:4px 10px}header .avatar{height:34px;width:34px}header .headperson{min-height:35px}@media(max-width:390px){.card{padding:9px}.btn,button{padding:8px 9px;min-height:37px}.stat strong{font-size:18px}.count button{min-width:32px}} </style></head><body><header><div class="headinner"><div class="headbrand">🎲 FDC</div><button class="headperson" onclick="openCharacter()" aria-label="Afficher les informations du personnage"><div><div class="headname" id="headName">Aldren</div><div class="tiny">TEST • Toucher pour les détails</div></div><div class="avatar" id="headAvatar">🧙</div></button></div></header><input type="file" id="photoInput" accept="image/*" onchange="setPortrait(this)"><main class="wrap" id="app"></main><nav class="tabs" id="tabs"></nav><div id="modal" class="overlay hidden"></div><div id="toast"></div><script>
const KEY='fdc-personnage-test-v01';const skills={FOR:['Athlétisme'],DEX:['Acrobaties','Escamotage','Discrétion'],CON:[],INT:['Arcanes','Histoire','Investigation','Nature','Religion'],SAG:['Dressage','Intuition','Médecine','Perception','Survie'],CHA:['Tromperie','Intimidation','Représentation','Persuasion']};const names={FOR:'Force',DEX:'Dextérité',CON:'Constitution',INT:'Intelligence',SAG:'Sagesse',CHA:'Charisme'};const initial=()=>({name:'Aldren',portrait:'',race:'Humain',cls:'Magicien',edition:'2014',level:3,hp:17,maxHp:20,ac:12,gold:120,coins:{pp:0,po:120,pe:0,pa:0,pc:0},stats:{FOR:8,DEX:14,CON:14,INT:16,SAG:12,CHA:10},dis:[],adv:[],effect:'Rajeunissement magique',effectOn:false,proficiencies:['Arcanes','Histoire'],saveProf:['INT','SAG'],weapons:[{id:1,name:'Bâton',qty:1,equipped:true,notes:'1d6−1 / 1d8−1 (2 mains) • Toucher +1'},{id:2,name:'Arc long',qty:1,equipped:false,notes:'1d8 perforants'},{id:3,name:'Flèches',qty:27,equipped:false,notes:'Munitions'},{id:4,name:'Javelines',qty:4,equipped:false,notes:'1d6 perforants'}],bag:[{id:5,name:'Potion de soins',qty:2,type:'heal',value:50,notes:'2d4 + 2 PV'},{id:6,name:'Diamant',qty:1,type:'treasure',value:50,notes:'Pierre précieuse'}],slots:{1:{used:0,max:4},2:{used:0,max:2}},notes:'',history:[]});let data;try{data=JSON.parse(localStorage.getItem(KEY))||initial()}catch{data=initial()}if(!data.coins)data.coins={pp:0,po:Number(data.gold)||0,pe:0,pa:0,pc:0};let tab='fiche',selected=null;const app=document.getElementById('app');const modal=document.getElementById('modal');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mod=x=>Math.floor((x-10)/2),fmt=n=>n>=0?'+'+n:''+n;const PARTY_KEY='fdc-multipersonnages-preview-v1';let party=JSON.parse(localStorage.getItem(PARTY_KEY)||'null');let active=Number(localStorage.getItem(PARTY_KEY+'-active')||0);if(!Array.isArray(party)||!party.length){let b=initial();Object.assign(b,{name:'Borin',race:'Nain',cls:'Barbare',level:3,hp:35,maxHp:35,ac:15,stats:{FOR:16,DEX:14,CON:16,INT:8,SAG:12,CHA:10},slots:{},weapons:[{id:30,name:'Hache à deux mains',qty:1,equipped:true,notes:'1d12 tranchants'},{id:31,name:'Javelines',qty:4,equipped:false,notes:'1d6 perforants'}],bag:[],coins:{pp:0,po:20,pe:0,pa:0,pc:0},history:[],rageUsed:0,rageActive:false});party=[data,b];active=0}data=party[active]||party[0];
function save(){party[active]=data;localStorage.setItem(PARTY_KEY,JSON.stringify(party));localStorage.setItem(PARTY_KEY+'-active',String(active));localStorage.setItem(KEY,JSON.stringify(data))}
function openParty(){show('<h2>👥 Mes personnages</h2>'+party.map((p,i)=>'<div class="item"><div class="row"><div><b>'+esc(p.name)+'</b><div class="muted">'+esc(p.race)+' • '+esc(p.cls)+' • niveau '+p.level+'</div></div>'+button(i===active?'✓ Actif':'Jouer','switchParty('+i+')','small')+'</div></div>').join('')+button('+ Créer un personnage','newParty()','secondary'))}
function switchParty(i){if(!party[i])return;active=i;data=party[i];save();closeModal();tab='fiche';render()}
function newParty(){let name=prompt('Nom du personnage');if(!name||!name.trim())return;let p=initial();p.name=name.trim();p.portrait='';p.weapons=[];p.bag=[];p.history=[];p.coins={pp:0,po:0,pe:0,pa:0,pc:0};party.push(p);switchParty(party.length-1)}
function isBarbarian(){return /barbare/i.test(data.cls)}
function rageMax(){return data.level>=20?Infinity:data.level>=17?6:data.level>=12?5:data.level>=6?4:data.level>=3?3:2}
function rageDamage(){return data.level>=16?4:data.level>=9?3:2}
function barbarianPanel(){if(!isBarbarian())return '';let max=rageMax(),used=data.rageUsed||0,active=!!data.rageActive;return '<div class="card" style="border:1px solid #a44b42"><h2>🔥 Rage du Barbare</h2><p class="muted">Rages restantes : <b>'+(max===Infinity?'∞':Math.max(0,max-used)+' / '+max)+'</b></p><div class="row">'+button(active?'⛔ Terminer la rage':'🔥 Entrer en rage','toggleRage()','primary')+'</div>'+(active?'<div class="item"><b>🔥 Rage active</b><p>+ '+rageDamage()+' dégâts aux attaques de mêlée utilisant la Force</p><p>Avantage aux tests et sauvegardes de Force</p><p>Résistance aux dégâts contondants, perforants et tranchants</p><p>Pas de sorts ni de concentration pendant la rage</p></div>':'')+'<div class="item"><b>⚔️ Attaques par action :</b> '+(data.level>=5?2:1)+'<div class="muted">Attaque supplémentaire débloquée au niveau 5</div></div>'+(data.level>=2?'<div class="item"><b>Attaque téméraire</b><p class="muted">Avantage à tes attaques de mêlée avec Force ce tour ; les ennemis ont avantage contre toi jusqu’au prochain tour.</p></div>':'')+'<p class="hint">La rage dure jusqu’à 1 minute, sous réserve des conditions de maintien. Le joueur termine la rage manuellement.</p></div>'}
function toggleRage(){if(!isBarbarian())return;if(data.rageActive){change(()=>{data.rageActive=false;log('Fin de rage')});return}if((data.rageUsed||0)>=rageMax())return alert('Plus de rage disponible avant un repos long.');change(()=>{data.rageUsed=(data.rageUsed||0)+1;data.rageActive=true;log('Entrée en rage')})}
const CLASS_RULES={Barbare:'d12 • Rage, Défense sans armure • Attaque supplémentaire au niveau 5',Barde:'d8 • Inspiration bardique et sorts',Clerc:'d8 • Incantation divine, domaine',Druide:'d8 • Forme sauvage, sorts',Ensorceleur:'d6 • Origine magique, points de sorcellerie',Guerrier:'d10 • Second souffle, Sursaut d’activité',Magicien:'d6 • Grimoire, préparation, récupération arcanique',Moine:'d8 • Arts martiaux, ki',Occultiste:'d8 • Pacte, emplacements de pacte',Paladin:'d10 • Imposition des mains, châtiment divin',Rôdeur:'d10 • Exploration, sorts',Roublard:'d8 • Attaque sournoise, action rusée'};
const RACE_RULES={'Demi-orc':'Endurance implacable, Attaques sauvages, vision dans le noir','Drakéide':'Souffle draconique et résistance selon ascendance','Demi-elfe':'Ascendance féérique, polyvalence, vision dans le noir','Gnome':'Ruse gnome, vision dans le noir','Tieffelin':'Résistance au feu, héritage infernal, vision dans le noir','Nain':'Vision dans le noir, résistance au poison (selon sous-race)','Elfe':'Vision dans le noir, ascendance féérique (selon sous-race)','Humain':'Traits selon variante choisie'};
function classRacePanel(){return '<div class="card"><h2>📚 Capacités du personnage</h2><div class="item"><b>'+esc(data.cls)+'</b><p class="muted">'+esc(CLASS_RULES[data.cls]||'Classe personnalisée : règles à renseigner')+'</p></div><div class="item"><b>'+esc(data.race)+'</b><p class="muted">'+esc(RACE_RULES[data.race]||'Traits raciaux à vérifier selon la sous-race')+'</p></div></div>'}
function change(fn){fn();save();render()}function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>el.style.display='none',2800)}function log(s){data.history.unshift(new Date().toLocaleString('fr-FR')+' — '+s);data.history=data.history.slice(0,40)}function count(item,collection,delta){change(()=>{item.qty=Math.max(0,item.qty+delta)})}function render(){document.getElementById('headName').textContent=data.name||'Personnage';document.getElementById('headAvatar').innerHTML=data.portrait?'<img src="'+data.portrait+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%" alt="Portrait">':'🧙';document.getElementById('tabs').innerHTML=[['fiche','🛡️','Fiche'],['sac','🎒','Sac à dos'],['sorts','✨','Sorts'],['reglages','⚙️','Options']].map(([id,ic,n])=>`<button class="${tab===id?'active':''}" onclick="tab='${id}';render()"><span>${ic}</span>${n}</button>`).join('');app.innerHTML=({fiche:fiche,sac:sac,sorts:sorts,reglages:reglages})[tab]()}function button(label,fn,cls='secondary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}function fiche(){const stat=selected?data.stats[selected]:0,p=mod(stat),pr=2+Math.floor((data.level-1)/4);const ratio=Math.max(0,data.hp)/Math.max(1,data.maxHp);const hpColor=ratio<=.05?'#e0444e':ratio<=.5?'#efa34b':'#3abf78';return `${barbarianPanel()}${classRacePanel()}<div class="card"><div class="row"><div><div class="muted">❤️ Points de vie</div><div class="big">${data.hp} <span class="muted">/ ${data.maxHp}</span></div></div><div style="text-align:right"><div class="muted">🛡️ Classe d’armure</div><div class="big">${data.ac}</div></div></div><div class="bar"><div style="width:${Math.min(100,100*ratio)}%;background:${hpColor}"></div></div><div class="row">${button('− Dégâts',"openHP('damage')")}${button('+ Soins',"openHP('heal')")}${button('✎ PV / CA',"openHP('edit')")}</div></div><div class="card"><div class="row"><h2>Caractéristiques</h2>${button('✎ Modifier',"openStats()",'small secondary')}</div><div class="grid">${Object.keys(names).map(k=>`<div class="stat ${selected===k?'active':''}" onclick="selected=selected==='${k}'?null:'${k}';render()"><small>${k}</small><strong>${fmt(mod(data.stats[k]))}</strong><small>Score ${data.stats[k]}</small>${data.effectOn&&data.dis.includes(k)?'<div class="badge">Désavantage</div>':data.effectOn&&data.adv.includes(k)?'<div class="badge">Avantage</div>':''}</div>`).join('')}</div>${selected?`<div class="line"><h3>${names[selected]} — Sauvegarde ${fmt(p+(data.saveProf.includes(selected)?pr:0))}</h3><div class="muted">${data.saveProf.includes(selected)?'Maîtrise appliquée • ':''}Bonus de maîtrise : +${pr}</div>${skills[selected].length?skills[selected].map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #383c46"><span>${s}${data.proficiencies.includes(s)?' ★':''}</span><strong>${fmt(p+(data.proficiencies.includes(s)?pr:0))}</strong></div>`).join(''):'<p class="muted">Aucune compétence associée.</p>'}${data.effectOn&&data.dis.includes(selected)?'<p class="pill">Désavantage aux jets concernés</p>':''}</div>`:''}</div><div class="card"><div class="row"><h2>⚔️ Armes & munitions</h2>${button('+ Ajouter',"openAdd('weapons')",'small secondary')}</div>${data.weapons.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)} ${w.equipped?'✓':''}</div><div class="muted">${esc(w.notes||'')}</div></div>${button('✎',`openEdit('weapons',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:8px"><span class="muted">Quantité</span><div class="count">${button('−',`updateQty('weapons',${w.id},-1)`,'small secondary')}<b>${w.qty}</b>${button('+',`updateQty('weapons',${w.id},1)`,'small secondary')}</div></div></div>`).join('')}</div><div class="card"><div class="row"><h2>✨ Sorts</h2>${button('Voir tous les sorts',"tab='sorts';render()",'small secondary')}</div><p class="muted">Emplacements disponibles (démo) :</p><div class="slotmini">${Object.entries(data.slots).map(([lv,x])=>`<div class="slotchip">Niv. ${lv} : <b>${x.max-x.used}/${x.max}</b> ${button('−',`slot(${lv},1)`,'small secondary')}${button('+',`slot(${lv},-1)`,'small secondary')}</div>`).join('')}</div><p class="muted">Les sorts attribués à la classe seront ajoutés après validation de la base de règles.</p></div>`}function sac(){return `<div class="card"><div class="row"><div><h2>🎒 Sac à dos</h2><div class="muted">Objets, potions et trésors</div></div>${button('+ Ajouter',"openAdd('bag')")}</div></div><div class="card"><div class="row"><div><h2>💰 Bourse</h2><div class="coinrow">${[['pp','PP'],['po','PO'],['pe','PE'],['pa','PA'],['pc','PC']].map(([k,label])=>`<div class="coin"><b>${data.coins[k]||0}</b><small>${label}</small></div>`).join('')}</div></div>${button('✎ Modifier',"openGold()")}</div></div><div class="card"><h2>Inventaire</h2>${data.bag.length?data.bag.map(w=>`<div class="item"><div class="row"><div><div class="itemname">${esc(w.name)}</div><div class="muted">${esc(w.notes||'')} ${w.value!==''?'• Valeur estimée : '+esc(w.value)+' PO':''}</div></div>${button('✎',`openEdit('bag',${w.id})`,'small ghost')}</div><div class="row" style="margin-top:10px"><div class="count">${button('−',`updateQty('bag',${w.id},-1)`,'small secondary')}<b>${w.qty}</b>${button('+',`updateQty('bag',${w.id},1)`,'small secondary')}</div><div style="display:flex;gap:6px">${['heal','consumable','food'].includes(w.type)?button('Utiliser',`openUse(${w.id})`,'small'):''}${button('Vendre',`openSale(${w.id})`,'small secondary')}</div></div></div>`).join(''):'<p class="muted">Ton sac est vide.</p>'}</div><div class="card"><h2>📝 Notes de butin</h2><textarea id="notes" rows="4" placeholder="Indices, origine des objets, descriptions…" oninput="data.notes=this.value;save()">${esc(data.notes)}</textarea></div>`}function sorts(){return `<div class="card"><h2>✨ Sorts et emplacements</h2><p class="hint">Cette version permet de tester le suivi des emplacements. Les listes officielles par classe, espèce, sous-classe et édition ne sont pas encore intégrées : aucun sort ne sera attribué automatiquement dans ce prototype.</p></div><div class="card">${Object.entries(data.slots).map(([lv,s])=>`<div class="item"><div class="row"><div><strong>Emplacements niveau ${lv}</strong><div class="muted">${s.max-s.used} / ${s.max} disponibles</div></div><div class="count">${button('−',`slot(${lv},1)`,'small secondary')}<b>${s.max-s.used}</b>${button('+',`slot(${lv},-1)`,'small secondary')}</div></div></div>`).join('')}${button('Repos long : récupérer les emplacements',"longRest()")}</div><div class="card"><h2>À intégrer dans la prochaine version</h2><p class="muted">Grimoire, sorts connus/préparés, capacités raciales, concentration et descriptions filtrées selon les règles 2014/2024.</p></div>`}function niveau(){return `<div class="card"><h2>⬆️ Progression</h2><div class="big">Niveau ${data.level} <span class="red">→ ${Math.min(20,data.level+1)}</span></div><p class="hint">Version test : montée de niveau simplifiée. Le moteur complet de progression par classe, espèce et édition n'est pas encore connecté. Les gains de capacités et de sorts doivent être vérifiés dans les règles.</p>${data.level<20?button('Tester la montée de niveau',"openLevel()"):''}</div><div class="card"><h2>Historique</h2>${data.history.length?data.history.map(x=>`<div class="line muted">${esc(x)}</div>`).join(''):'<p class="muted">Aucune modification enregistrée.</p>'}</div>`}function reglages(){return `<div class="card"><h2>⚙️ Personnage</h2>${button('Modifier identité et édition',"openCharacter()")}</div><div class="card"><h2>💾 Sauvegarde</h2><p class="muted">Les modifications sont conservées localement dans ce navigateur sur cet appareil. Elles ne se synchronisent pas entre appareils. Pour éviter toute perte, exporte une copie.</p><div class="row">${button('Exporter JSON',"exportData()")}${button('Importer JSON',"document.getElementById('importfile').click()",'secondary')}</div><input type="file" id="importfile" accept="application/json" class="hidden" onchange="importData(this)"></div><div class="card"><h2>Réinitialiser la démo</h2>${button('Remettre les données fictives',"resetDemo()",'secondary')}</div>`}function show(html){modal.classList.remove('hidden');modal.innerHTML=`<div class="dialog"><div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button type="button" class="secondary" onclick="closeModal()">✕ Fermer</button></div>${html}</div>`}function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}function num(id){return Number(document.getElementById(id).value)}function textval(id){return document.getElementById(id).value}function openHP(mode){if(mode==='edit'){show(`<h2>Modifier PV et CA</h2><label>PV actuels</label><input id="a" type="number" value="${data.hp}"><label>PV maximum</label><input id="b" type="number" value="${data.maxHp}"><label>Classe d'armure</label><input id="c" type="number" value="${data.ac}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer',`saveHP()`)}</div>`);return}show(`<h2>${mode==='heal'?'❤️ Soigner':'⚔️ Subir des dégâts'}</h2><p class="muted">Saisis le résultat de tes dés physiques ou les dégâts annoncés par le MJ.</p><label>${mode==='heal'?'PV récupérés':'Dégâts subis'}</label><input id="amount" type="number" min="0" value="5"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`applyHP('${mode}')`)}</div>`)}function saveHP(){let a=num('a'),b=num('b'),c=num('c');if(![a,b,c].every(Number.isFinite)||b<1||a<0||c<0)return alert('Valeurs invalides');change(()=>{data.maxHp=b;data.hp=Math.min(a,b);data.ac=c;log('PV / CA modifiés')});closeModal()}function applyHP(mode){let v=num('amount');if(!Number.isFinite(v)||v<0)return alert('Valeur invalide');change(()=>{data.hp=mode==='heal'?Math.min(data.maxHp,data.hp+v):Math.max(0,data.hp-v);log((mode==='heal'?'Soins':'Dégâts')+' : '+v)});closeModal()}function openStats(){show(`<h2>Modifier les caractéristiques</h2>${Object.keys(names).map(k=>`<div class="row"><label style="min-width:95px">${names[k]}</label><input id="st${k}" type="number" min="1" max="30" value="${data.stats[k]}"></div>`).join('')}<div class="line"><label>Nom de l'effet personnalisé</label><input id="effect" value="${esc(data.effect)}"><div class="check"><input type="checkbox" id="effectOn" ${data.effectOn?'checked':''}><label for="effectOn">Effet actif</label></div><p class="muted">Choisis les caractéristiques avec désavantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="dis${k}" ${data.dis.includes(k)?'checked':''}>${names[k]}</label>`).join('')}<p class="muted">Choisis les caractéristiques avec avantage :</p>${Object.keys(names).map(k=>`<label class="check"><input type="checkbox" id="adv${k}" ${data.adv.includes(k)?'checked':''}>${names[k]}</label>`).join('')}</div><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveStats()')}</div>`)}function saveStats(){let vals=Object.fromEntries(Object.keys(names).map(k=>[k,num('st'+k)]));if(Object.values(vals).some(x=>!Number.isInteger(x)||x<1||x>30))return alert('Scores attendus de 1 à 30');change(()=>{data.stats=vals;data.effect=textval('effect');data.effectOn=document.getElementById('effectOn').checked;data.dis=Object.keys(names).filter(k=>document.getElementById('dis'+k).checked);data.adv=Object.keys(names).filter(k=>document.getElementById('adv'+k).checked);log('Caractéristiques / effets modifiés')});closeModal()}function updateQty(collection,id,delta){change(()=>{let x=data[collection].find(x=>x.id===id);if(x)x.qty=Math.max(0,x.qty+delta)})}function openAdd(collection){show(`<h2>${collection==='weapons'?'Ajouter une arme ou munition':'Ajouter au sac'}</h2><label>Nom</label><input id="n" placeholder="Ex. 12 flèches, potion, diamant…"><label>Quantité</label><input id="q" type="number" value="1" min="1">${collection==='bag'?'<label>Type</label><select id="type"><option value="other">Objet / trésor</option><option value="heal">Potion de soins</option><option value="consumable">Potion / consommable</option><option value="food">Nourriture / consommable</option></select><label>Valeur estimée en PO (facultatif)</label><input id="v" type="number" min="0" placeholder="Inconnue">':''}<label>Notes / effet</label><input id="note" placeholder="Description libre"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Ajouter',`addItem('${collection}')`)}</div><p class="muted">La dictée vocale peut utiliser le micro du clavier de ton téléphone.</p>`)}function addItem(collection){let n=textval('n').trim(),q=num('q');if(!n||!Number.isInteger(q)||q<1)return alert('Indique un nom et une quantité valide');let v=collection==='bag'?textval('v'):'';if(v!==''&&(!Number.isFinite(Number(v))||Number(v)<0))return alert('Valeur invalide');change(()=>{data[collection].push({id:Date.now(),name:n,qty:q,notes:textval('note'),...(collection==='bag'?{type:textval('type'),value:v}:{equipped:false})});log('Ajout : '+n)});closeModal();toast('Objet ajouté')}function openEdit(collection,id){let w=data[collection].find(x=>x.id===id);if(!w)return;show(`<h2>Modifier l'objet</h2><label>Nom</label><input id="n" value="${esc(w.name)}"><label>Notes</label><input id="note" value="${esc(w.notes||'')}">${collection==='bag'?`<label>Valeur estimée en PO</label><input id="v" type="number" value="${esc(w.value??'')}"><label>Type</label><select id="type"><option value="other" ${w.type==='other'||w.type==='treasure'?'selected':''}>Objet / trésor</option><option value="heal" ${w.type==='heal'?'selected':''}>Potion de soins</option><option value="consumable" ${w.type==='consumable'?'selected':''}>Potion / consommable</option><option value="food" ${w.type==='food'?'selected':''}>Nourriture / consommable</option></select>`:`<label class="check"><input id="eq" type="checkbox" ${w.equipped?'checked':''}>Arme équipée</label>`}<div class="row">${button('Supprimer',`deleteItem('${collection}',${id})`,'secondary')}${button('Enregistrer',`saveItem('${collection}',${id})`)}</div>${button('Annuler','closeModal()','ghost')}`)}function saveItem(c,id){let n=textval('n').trim();if(!n)return alert('Nom requis');change(()=>{let w=data[c].find(x=>x.id===id);w.name=n;w.notes=textval('note');if(c==='bag'){w.value=textval('v');w.type=textval('type')}else w.equipped=document.getElementById('eq').checked});closeModal()}function deleteItem(c,id){if(!confirm('Supprimer cet objet ?'))return;change(()=>{data[c]=data[c].filter(x=>x.id!==id)});closeModal()}function openUse(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return toast('Objet épuisé');show(`<h2>🧪 Utiliser : ${esc(w.name)}</h2><p class="muted">Effet noté : ${esc(w.notes||'Non renseigné')}</p><p class="muted">Lance tes dés physiques si nécessaire. Si l'objet rend des PV, indique le total. Sinon, laisse 0.</p><label>PV récupérés</label><input id="heal" type="number" min="0" value="0"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Confirmer',`useHeal(${id})`)}</div>`)}function useHeal(id){let n=num('heal'),w=data.bag.find(x=>x.id===id);if(!w||w.qty<1||!Number.isFinite(n)||n<0)return alert('Valeur invalide');let actual=Math.min(n,Math.max(0,data.maxHp-data.hp));change(()=>{data.hp+=actual;w.qty--;log(w.name+' utilisée : '+actual+' PV récupérés')});closeModal();toast(actual?('+'+actual+' PV • objet décompté'):'Objet utilisé et décompté')}function openSale(id){let w=data.bag.find(x=>x.id===id);if(!w||w.qty<1)return;show(`<h2>💰 Vendre : ${esc(w.name)}</h2><p class="muted">Valeur estimée : ${esc(w.value||'inconnue')} PO par unité. Saisis le prix réellement obtenu auprès du marchand.</p><label>Quantité vendue (max ${w.qty})</label><input id="q" type="number" min="1" max="${w.qty}" value="1"><label>Prix total obtenu (PO)</label><input id="sale" type="number" min="0" value="${Number(w.value)||0}"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Vendre',`sell(${id})`)}</div>`)}function sell(id){let q=num('q'),price=num('sale'),w=data.bag.find(x=>x.id===id);if(!w||!Number.isInteger(q)||q<1||q>w.qty||!Number.isFinite(price)||price<0)return alert('Quantité ou prix invalide');change(()=>{w.qty-=q;data.coins.po+=price;data.gold=data.coins.po;log('Vente '+q+' × '+w.name+' : +'+price+' PO')});closeModal();toast('+'+price+' PO dans la bourse')}function openGold(){show(`<h2>💰 Modifier la bourse</h2><p class="muted">PP : platine · PO : or · PE : électrum · PA : argent · PC : cuivre.</p>${[['pp','Platine'],['po','Or'],['pe','Électrum'],['pa','Argent'],['pc','Cuivre']].map(([k,n])=>`<label>Pièces de ${n}</label><input id="coin_${k}" type="number" min="0" step="1" value="${data.coins[k]||0}">`).join('')}<div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveGold()')}</div>`)}function saveGold(){let next={};for(let k of ['pp','po','pe','pa','pc']){let n=num('coin_'+k);if(!Number.isSafeInteger(n)||n<0)return alert('Montant invalide');next[k]=n}change(()=>{data.coins=next;data.gold=next.po;log('Bourse modifiée')});closeModal()}function slot(l,delta){change(()=>{let s=data.slots[l];s.used=Math.max(0,Math.min(s.max,s.used+delta))})}function longRest(){if(!confirm('Effectuer un repos long ?'))return;change(()=>{Object.values(data.slots).forEach(s=>s.used=0);data.hp=data.maxHp;data.rageUsed=0;data.rageActive=false;log('Repos long')});toast('Repos long terminé')}function setPortrait(input){const file=input.files&&input.files[0];if(!file)return;if(file.size>4000000){alert('Choisis une image de moins de 4 Mo.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=260,scale=Math.min(1,max/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);change(()=>{data.portrait=c.toDataURL('image/jpeg',.75)});toast('Portrait enregistré')};img.src=reader.result};reader.readAsDataURL(file)}function openCharacter(){show(`<h2>👥 Personnages</h2>${button("Changer de personnage","closeModal();openParty()","secondary")}<h3>Informations du personnage</h3><div style="text-align:center;margin-bottom:10px"><div style="font-size:42px">${data.portrait?'<img src="'+data.portrait+'" style="width:85px;height:85px;object-fit:cover;border-radius:50%">':'🧙'}</div>${button('📷 Choisir une photo',"document.getElementById('photoInput').click()",'secondary small')}</div><p class="muted">Ces informations restent accessibles en touchant le portrait ou le nom en haut de la fiche.</p><label>Nom</label><input id="name" value="${esc(data.name)}"><label>Race / espèce</label><input id="race" value="${esc(data.race)}"><label>Classe</label><input id="cls" value="${esc(data.cls)}"><div class="row"><div><strong>Niveau ${data.level}</strong></div>${data.level<20?button("⬆ Monter de niveau","closeModal();openLevel()","small secondary"):""}</div><label>Édition</label><select id="edition"><option ${data.edition==='2014'?'selected':''}>2014</option><option ${data.edition==='2024'?'selected':''}>2024</option></select><p class="hint">Changer la classe ou l'édition ne recalcule pas encore les capacités et sorts dans cette démo.</p><div class="row">${button('Annuler','closeModal()','secondary')}${button('Enregistrer','saveCharacter()')}</div>`)}function saveCharacter(){change(()=>{data.name=textval('name');data.race=textval('race');data.cls=textval('cls');data.edition=textval('edition')});closeModal()}function openLevel(){show(`<h2>Passage niveau ${data.level} → ${data.level+1}</h2><p class="hint">Simulation manuelle : les choix de sorts et capacités de classe ne sont pas encore automatisés.</p><label>PV maximum gagnés (résultat de ton dé de vie + Constitution, ou valeur fixe)</label><input id="gain" type="number" min="1" value="5"><div class="row">${button('Annuler','closeModal()','secondary')}${button('Valider le niveau',`levelUp()`)}</div>`)}function levelUp(){let g=num('gain');if(!Number.isInteger(g)||g<1||data.level>=20)return alert('Gain de PV invalide');change(()=>{data.level++;data.maxHp+=g;data.hp+=g;log('Passage au niveau '+data.level+' (+'+g+' PV max)')});closeModal();toast('Niveau '+data.level+' enregistré')}function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fdc-personnage-'+data.name.replace(/[^a-z0-9-]/gi,'_')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.stats||!d.bag||!d.weapons)throw Error();if(!confirm('Remplacer la fiche actuelle par cette sauvegarde ?'))return;data=d;save();render();toast('Fiche importée')}catch{alert('Fichier de sauvegarde non reconnu')}};r.readAsText(f)}function resetDemo(){if(!confirm('Effacer les données de test et repartir de zéro ?'))return;data=initial();save();render()}document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});render();
</script></body></html>
